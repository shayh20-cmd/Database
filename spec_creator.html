<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחולל מפרטים ג2</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#1f2733; --muted:#6b7683; --line:#e2e7ee;
  --brand:#1f5f8b; --brand-soft:#e8f0f7; --arch:#0d7d6b; --arch-soft:#e2f4f0;
  --off:#aeb7c2; --warn:#c2703d; --shadow:0 1px 2px rgba(20,35,60,.06),0 6px 20px rgba(20,35,60,.06);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- Top bar ---------- */
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:18px;box-shadow:var(--shadow);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--brand)}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#2d84bd);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.proj-meta{display:flex;gap:14px;align-items:center;flex:1;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.field .val{font-weight:600}
.field .val.edit{border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:#fbfcfe;min-width:120px}
.preset-badge{background:var(--arch-soft);color:var(--arch);border:1px solid #bfe6dd;padding:5px 11px;border-radius:20px;font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn:hover{background:#f6f8fb}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#1a5379}
.btn.ghost{background:transparent}

/* ---------- Body layout ---------- */
.body{display:flex;flex:1;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{width:330px;background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.side-head h2{margin:0;font-size:14px;font-weight:800}
.side-head p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;padding:8px 16px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px}
.dot.arch{background:var(--arch)} .dot.other{background:var(--off)}
.tree{overflow-y:auto;flex:1;padding:4px 8px 20px}
.chap{margin:3px 0}
.chap-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer}
.chap-row:hover{background:#f5f8fb}
.chap-row .caret{color:var(--muted);font-size:11px;width:12px;transition:transform .15s}
.chap.open .caret{transform:rotate(90deg)}
.chap-num{font-weight:700;font-size:11px;color:#fff;background:var(--arch);border-radius:6px;padding:2px 7px;min-width:26px;text-align:center}
.chap.other .chap-num{background:var(--off)}
.chap-name{font-weight:600;flex:1}
.chap.other .chap-name{color:var(--muted)}
.count{font-size:11px;color:var(--muted);background:#f0f3f7;border-radius:20px;padding:1px 8px}
.subs{padding:2px 0 6px 0;margin-inline-start:14px;border-inline-start:2px dashed var(--line)}
.sub-row{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 12px;border-radius:8px;cursor:pointer;margin:1px 4px}
.sub-row:hover{background:#f5f8fb}
.sub-row.active{background:var(--brand-soft);outline:1px solid #cfe0ee}
.sub-row.active .sub-name{color:var(--brand);font-weight:700}
.sub-name{flex:1;font-size:13px}
.sub-row.off .sub-name{color:var(--off);text-decoration:line-through}
.sub-num{font-size:10.5px;font-weight:700;color:var(--muted);min-width:36px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sub-row.active .sub-num{color:var(--brand)}
.sub-row.off .sub-num{color:var(--off)}
.sub-row[draggable]{cursor:grab}
.sub-row.dragging{opacity:.4}
.sub-row.drop-top{box-shadow:inset 0 2px 0 0 var(--brand)}
.sub-row.drop-bottom{box-shadow:inset 0 -2px 0 0 var(--brand)}
.tog{width:34px;height:19px;border-radius:20px;background:#d3dae2;position:relative;flex:none;transition:.15s}
.tog.on{background:var(--arch)}
.tog::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;right:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on::after{right:17px}
.add-sub{display:flex;align-items:center;gap:7px;padding:7px 12px;margin:2px 4px;color:var(--brand);font-weight:600;font-size:12.5px;cursor:pointer;border-radius:8px;border:1px dashed #cfe0ee}
.add-sub:hover{background:var(--brand-soft)}

/* ---------- Editor ---------- */
.editor{flex:1;overflow-y:auto;padding:22px 30px}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs b{color:var(--ink)}
.ed-title{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.ed-title h1{margin:0;font-size:22px;font-weight:800}
.ed-title .tag{font-size:11px;font-weight:700;color:var(--arch);background:var(--arch-soft);border:1px solid #bfe6dd;padding:3px 9px;border-radius:20px}
.ed-sub{color:var(--muted);margin:0 0 16px;font-size:13px}
.ed-toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.chip:hover{background:#f6f8fb;color:var(--ink)}
.hint{font-size:11.5px;color:var(--muted);background:#fbf6ee;border:1px solid #f0e2cc;border-radius:8px;padding:7px 11px;margin-bottom:14px;display:flex;gap:7px;align-items:center}

.doc{max-width:840px;margin:0 auto}

/* clause */
.clause{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;display:flex;align-items:stretch;gap:0;box-shadow:var(--shadow);transition:box-shadow .12s,transform .12s}
.clause.dragging{opacity:.5;box-shadow:0 10px 24px rgba(20,35,60,.18)}
.clause.drop-target{box-shadow:0 0 0 2px var(--brand)}
.reorder{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 5px;border-inline-end:1px solid #eef1f5}
.reorder .grip{color:#c2ccd7;cursor:grab;text-align:center;font-size:13px;line-height:1;user-select:none}
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.mv{width:22px;height:20px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.mv:hover{background:var(--brand-soft);color:var(--brand);border-color:#cfe0ee}
.mv svg{width:11px;height:11px;fill:currentColor;display:block}
.clause .num{font-weight:700;color:var(--brand);font-size:12px;padding:12px 10px 0 6px;white-space:nowrap;min-width:64px;text-align:center}
.clause .body-col{flex:1;display:flex;flex-direction:column}
.clause .txt{padding:11px 8px;outline:none;border-radius:8px}
.clause .txt:focus{background:#fbfdff;box-shadow:inset 0 0 0 1px #d7e6f2}
.clause .tools{display:flex;gap:4px;padding:0 8px 9px;opacity:0;transition:.12s}
.clause:hover .tools{opacity:1}
.tbtn{font-size:11px;color:var(--muted);background:#f4f7fa;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;font-weight:600}
.tbtn:hover{background:var(--brand-soft);color:var(--brand)}
.tbtn.danger:hover{background:#f8ece5;color:var(--warn);border-color:#eccdbb}
.clause.kind-standard{background:#fbfcfe}
.clause.kind-standard .txt{color:#274b63}
.clause.kind-heading{background:#f7f9fc}
.clause.kind-heading .txt{font-weight:800;font-size:15px}
.clause.parent{background:#f9fbfd}
.clause.parent>.body-col>.txt{font-weight:600}
.parent-tag{font-size:10px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid #cfe0ee;border-radius:20px;padding:1px 8px;align-self:flex-start;margin:0 8px 4px}

/* grouped parent + children: one card, parent as header, sub-clauses split by rules */
.clause-group{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.clause-group>.clause{border:none;box-shadow:none;margin:0;border-radius:0;background:#f4f7fb}
.clause-group.kind-heading-group>.clause{background:#eef3f8}
.subclauses{margin:0;padding-inline-start:14px;border-top:1px solid var(--line)}
.subclauses>.clause{background:#fff;margin:0;border:none;border-radius:0;box-shadow:none}
.subclauses>.clause + .clause{border-top:1px solid var(--line)}
.subclauses .clause .num{color:#2d84bd;min-width:78px;font-size:11.5px}
.subclauses .clause-group{margin:8px 0;box-shadow:none}
.add-clause{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border:1.5px dashed #cfd8e2;border-radius:9px;color:var(--brand);font-weight:600;cursor:pointer;font-size:12.5px}
.add-clause:hover{background:var(--brand-soft)}
.add-clause.nested{margin-inline-start:34px;margin-bottom:8px}
.add-clause.top{margin-top:4px}
.mini{font-size:11px;color:var(--muted)}

/* ---------- Projects view ---------- */
.pv{max-width:900px;margin:40px auto;padding:0 20px}
.pv h1{font-size:24px;font-weight:800;margin:0 0 16px}
.proj-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.proj-card:hover{background:#f6f8fb}
.proj-card .meta{color:var(--muted);font-size:12.5px}
.wizard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.wizard label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 3px}
.wizard input,.wizard select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:14px;background:#fbfcfe}

/* ---------- Print ---------- */
.printable{display:none}
.printable h1{text-align:center;font-size:22px;margin:0 0 4px}
.printable .print-sub{text-align:center;color:#555;margin:0 0 20px}
.printable h2{font-size:18px;border-bottom:2px solid #333;padding-bottom:3px;margin:22px 0 10px}
.printable h3{font-size:14px;margin:14px 0 6px}
.printable .pc{margin-inline-start:14px}
.printable p{margin:3px 0}
@media print{
  .topbar,.sidebar,.ed-toolbar,.reorder,.tools,.add-clause,.add-sub,.crumbs,.ed-title,.ed-sub,.doc{display:none !important}
  .printable{display:block}
  .app,.body,.editor,main.editor{display:block;height:auto;overflow:visible}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="tools/spec-creator/lib/numbering.js?v=2"></script>
<script src="tools/spec-creator/lib/project.js?v=2"></script>
<script src="tools/spec-creator/lib/tree-ops.js?v=2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script id="app-src" type="text/babel-app">
const { useState, useEffect, useRef, useCallback } = React;

// ---------- storage ----------
async function apiGet(name) { const r = await fetch('/api/' + name); return r.json(); }
async function apiPost(name, data) {
  await fetch('/api/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
}

function App() {
  const [library, setLibrary] = useState(null);
  const [projects, setProjects] = useState({ items: [] });
  const [activeId, setActiveId] = useState(null);
  const [wizard, setWizard] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      const lib = await apiGet('spec-library');
      const pr = await apiGet('spec-projects');
      setLibrary(lib && lib.chapters ? lib : { chapters: [], presets: [] });
      setProjects(pr && pr.items ? pr : { items: [] });
    })();
  }, []);

  const persist = useCallback((next) => {
    setProjects(next);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => apiPost('spec-projects', { ...next, _ts: Date.now() }), 400);
  }, []);

  const updateProject = useCallback((proj) => {
    persist({ items: projects.items.map(p => p.id === proj.id ? proj : p) });
  }, [projects, persist]);

  if (!library) return <div style={{ padding: 40 }}>טוען…</div>;

  const active = projects.items.find(p => p.id === activeId);
  if (active) {
    return <Editor project={active} library={library}
                   onChange={updateProject} onBack={() => setActiveId(null)} />;
  }
  return <ProjectsView projects={projects} library={library} wizard={wizard}
                       setWizard={setWizard}
                       onOpen={setActiveId}
                       onCreate={(proj) => { persist({ items: [...projects.items, proj] }); setWizard(false); setActiveId(proj.id); }} />;
}

function ProjectsView({ projects, library, wizard, setWizard, onOpen, onCreate }) {
  return (
    <div className="pv">
      <h1>מחולל מפרטים ג2</h1>
      {!wizard && <button className="btn primary" onClick={() => setWizard(true)}>＋ פרויקט חדש</button>}
      {wizard && <Wizard library={library} onCancel={() => setWizard(false)} onCreate={onCreate} />}
      <div style={{ marginTop: 18 }}>
        {projects.items.map(p => (
          <div key={p.id} className="proj-card" onClick={() => onOpen(p.id)}>
            <div><b>{p.name || '(ללא שם)'}</b> <span className="meta"> · {p.buildingType}</span></div>
            <div className="meta">{p.date} · מהדורה {p.revision}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Wizard({ library, onCancel, onCreate }) {
  const [f, setF] = useState({ name: '', date: new Date().toISOString().slice(0, 10), revision: '01',
    presetId: (library.presets[0] || {}).id || '' });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const create = () => {
    const preset = library.presets.find(p => p.id === f.presetId);
    const proj = window.SpecProject.createProjectFromPreset(library, f.presetId,
      { name: f.name, date: f.date, revision: f.revision, buildingType: preset ? preset.buildingType : '' });
    onCreate(proj);
  };
  return (
    <div className="wizard">
      <label>שם הפרויקט</label><input value={f.name} onChange={set('name')} placeholder="לדוגמה: מרכז קהילתי נווה יהושע" />
      <label>תאריך</label><input type="date" value={f.date} onChange={set('date')} />
      <label>מהדורה</label><input value={f.revision} onChange={set('revision')} />
      <label>סוג מבנה (PRESET)</label>
      <select value={f.presetId} onChange={set('presetId')}>
        {library.presets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
      </select>
      <div style={{ marginTop: 16, display: 'flex', gap: 8 }}>
        <button className="btn primary" onClick={create} disabled={!f.presetId}>צור פרויקט</button>
        <button className="btn" onClick={onCancel}>ביטול</button>
      </div>
    </div>
  );
}

function Editor({ project, library, onChange, onBack }) {
  const firstIncluded = project.chapters.find(c => c.included) || project.chapters[0];
  const [activeChap, setActiveChap] = useState(firstIncluded ? firstIncluded.num : null);
  const [activeSub, setActiveSub] = useState(null);

  const setChapter = (num, patch) =>
    onChange({ ...project, chapters: project.chapters.map(c => c.num === num ? { ...c, ...patch } : c) });
  const setSub = (num, subId, patch) =>
    setChapter(num, { subChapters: project.chapters.find(c => c.num === num).subChapters.map(
      s => s.id === subId ? { ...s, ...patch } : s) });

  const chap = project.chapters.find(c => c.num === activeChap);
  const sub = chap && chap.subChapters.find(s => s.id === activeSub);

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand"><span className="logo">מ</span> מחולל מפרטים ג2</div>
        <div className="proj-meta">
          <div className="field"><label>שם הפרויקט</label><div className="val">{project.name}</div></div>
          <div className="field"><label>מהדורה</label><div className="val">{project.revision}</div></div>
          <div className="preset-badge">◆ {project.buildingType}</div>
        </div>
        <div className="actions">
          <button className="btn" onClick={() => window.print()}>⎙ הדפסה / PDF</button>
          <button className="btn" onClick={onBack}>← פרויקטים</button>
        </div>
      </div>
      <div className="body">
        <ChapterTree project={project} activeChap={activeChap} activeSub={activeSub}
          onToggleChapter={(num, val) => setChapter(num, { included: val })}
          onToggleSub={(num, subId, val) => setSub(num, subId, { included: val })}
          onSelect={(num, subId) => { setActiveChap(num); setActiveSub(subId); }}
          onReorderSub={(num, fromId, toId, after) => {
            const c = project.chapters.find(x => x.num === num);
            setChapter(num, { subChapters: window.SpecTree.reorderById(c.subChapters, fromId, toId, after) });
          }}
          onAddSub={(num) => {
            const nc = project.chapters.find(c => c.num === num);
            const newSub = { id: window.SpecTree.genId(), title: 'תת-פרק חדש', included: true, clauses: [] };
            setChapter(num, { subChapters: [...nc.subChapters, newSub] });
            setActiveChap(num); setActiveSub(newSub.id);
          }} />
        <main className="editor">
          {sub
            ? <ClauseEditor chap={chap} sub={sub}
                onChangeClauses={(clauses) => setSub(chap.num, sub.id, { clauses })}
                onChangeTitle={(title) => setSub(chap.num, sub.id, { title })} />
            : <div style={{ padding: 30, color: 'var(--muted)' }}>בחר תת-פרק מהעץ מימין.</div>}
        </main>
      </div>
      <PrintDoc project={project} />
    </div>
  );
}

function renderPrintClauses(clauses, numbers) {
  return clauses.map(c => (
    <div key={c.id} className="pc">
      <p><b>{numbers[c.id]}</b> {c.text}</p>
      {c.children && c.children.length ? renderPrintClauses(c.children, numbers) : null}
    </div>
  ));
}

function PrintDoc({ project }) {
  return (
    <div className="printable">
      <h1>{project.name}</h1>
      <p className="print-sub">מפרט טכני (ג2) · מהדורה {project.revision} · {project.date}</p>
      {project.chapters.filter(c => c.included).map(c => {
        const numbers = window.SpecNumbering.assignNumbers(c.num, c.subChapters);
        const subs = c.subChapters.filter(s => s.included);
        if (!subs.length) return null;
        return (
          <section key={c.num}>
            <h2>פרק {window.SpecNumbering.chapterCode(c.num)} – {c.name}</h2>
            {subs.map(s => (
              <div key={s.id}>
                <h3>{numbers[s.id]} {s.title}</h3>
                {renderPrintClauses(s.clauses, numbers)}
              </div>
            ))}
          </section>
        );
      })}
    </div>
  );
}

function ChapterTree({ project, activeChap, activeSub, onToggleChapter, onToggleSub, onSelect, onReorderSub, onAddSub }) {
  const [open, setOpen] = useState({});
  const [drag, setDrag] = useState(null);   // { chapNum, subId }
  const [drop, setDrop] = useState(null);   // { subId, after }

  const overSub = (e, chapNum, subId) => {
    if (!drag || drag.chapNum !== chapNum) return;
    e.preventDefault();
    const r = e.currentTarget.getBoundingClientRect();
    setDrop({ subId, after: (e.clientY - r.top) > r.height / 2 });
  };
  const dropSub = (e, chapNum, subId) => {
    if (!drag || drag.chapNum !== chapNum) { setDrag(null); setDrop(null); return; }
    e.preventDefault();
    const r = e.currentTarget.getBoundingClientRect();
    const after = (e.clientY - r.top) > r.height / 2;
    if (drag.subId !== subId) onReorderSub(chapNum, drag.subId, subId, after);
    setDrag(null); setDrop(null);
  };

  return (
    <aside className="sidebar">
      <div className="side-head"><h2>פרקים ותתי-פרקים</h2><p>סמן מה כלול · גרור לשינוי סדר. פרקי אדריכלות מודגשים.</p></div>
      <div className="legend"><span><i className="dot arch"></i> אדריכלות</span><span><i className="dot other"></i> אחר</span></div>
      <div className="tree">
        {project.chapters.map(c => {
          const isArch = c.discipline === 'ARCH';
          const isOpen = open[c.num];
          const numbers = window.SpecNumbering.assignNumbers(c.num, c.subChapters);
          return (
            <div key={c.num} className={'chap' + (isArch ? '' : ' other') + (isOpen ? ' open' : '')}>
              <div className="chap-row" onClick={() => setOpen({ ...open, [c.num]: !isOpen })}>
                <span className="caret">▸</span>
                <span className="chap-num">{window.SpecNumbering.chapterCode(c.num)}</span>
                <span className="chap-name">{c.name}</span>
                <span className="count">{c.included ? c.subChapters.filter(s => s.included).length : '—'}</span>
              </div>
              {isOpen && (
                <div className="subs">
                  {c.subChapters.map(s => {
                    const isDragging = drag && drag.subId === s.id;
                    const isDrop = drop && drop.subId === s.id;
                    return (
                      <div key={s.id}
                           className={'sub-row' + (s.id === activeSub ? ' active' : '') + (s.included ? '' : ' off')
                             + (isDragging ? ' dragging' : '') + (isDrop ? (drop.after ? ' drop-bottom' : ' drop-top') : '')}
                           draggable
                           onDragStart={(e) => { setDrag({ chapNum: c.num, subId: s.id }); e.dataTransfer.effectAllowed = 'move'; }}
                           onDragOver={(e) => overSub(e, c.num, s.id)}
                           onDrop={(e) => dropSub(e, c.num, s.id)}
                           onDragEnd={() => { setDrag(null); setDrop(null); }}
                           onClick={() => onSelect(c.num, s.id)}>
                        <span className={'tog' + (s.included ? ' on' : '')}
                              onClick={(e) => { e.stopPropagation(); onToggleSub(c.num, s.id, !s.included); }}></span>
                        <span className="sub-num">{numbers[s.id]}</span>
                        <span className="sub-name">{s.title}</span>
                      </div>
                    );
                  })}
                  <div className="add-sub" onClick={() => onAddSub(c.num)}>＋ הוסף תת-פרק</div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </aside>
  );
}

function ClauseEditor({ chap, sub, onChangeClauses, onChangeTitle }) {
  const numbers = window.SpecNumbering.assignNumbers(chap.num, chap.subChapters);
  const base = numbers[sub.id] || '';

  const op = (fn) => onChangeClauses(fn(sub.clauses));

  const renderClause = (c, depth) => {
    const isHeading = c.kind === 'heading';
    const isStd = c.kind === 'standard';
    const hasChildren = c.children && c.children.length;
    const clauseEl = (
      <div className={'clause' + (isHeading ? ' kind-heading' : '') + (isStd ? ' kind-standard' : '') + (hasChildren ? ' parent' : '')}>
        <div className="reorder">
          <span className="grip">⋮⋮</span>
          <div className="mv-grid">
            <button className="mv" title="הזז מעלה" onClick={() => op(t => window.SpecTree.move(t, c.id, -1))}>▲</button>
            <button className="mv" title="הזז מטה" onClick={() => op(t => window.SpecTree.move(t, c.id, 1))}>▼</button>
            <button className="mv nest" title="הזח החוצה (רמה מעלה)" onClick={() => op(t => window.SpecTree.outdent(t, c.id))}>
              <svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="2" height="9"/><polygon points="13,3.5 13,12.5 5.5,8"/></svg>
            </button>
            <button className="mv nest" title="הזח פנימה (הפוך לתת-סעיף)" onClick={() => op(t => window.SpecTree.indent(t, c.id))}>
              <svg viewBox="0 0 16 16"><polygon points="3,3.5 3,12.5 10.5,8"/><rect x="11.5" y="3.5" width="2" height="9"/></svg>
            </button>
          </div>
        </div>
        <div className="num">{numbers[c.id]}</div>
        <div className="body-col">
          <div className="txt" contentEditable suppressContentEditableWarning
               onBlur={(e) => op(t => window.SpecTree.setText(t, c.id, e.currentTarget.innerText))}>
            {c.text}
          </div>
          <div className="tools">
            <span className="tbtn" onClick={() => op(t => window.SpecTree.addChild(t, c.id, 'paragraph').tree)}>＋ תת-סעיף</span>
            <span className="tbtn danger" onClick={() => op(t => window.SpecTree.remove(t, c.id))}>מחק</span>
          </div>
        </div>
      </div>
    );
    if (!hasChildren) return <React.Fragment key={c.id}>{clauseEl}</React.Fragment>;
    return (
      <div key={c.id} className={'clause-group' + (isHeading ? ' kind-heading-group' : '')}>
        {clauseEl}
        <div className="subclauses">{c.children.map(cc => renderClause(cc, depth + 1))}</div>
      </div>
    );
  };

  return (
    <div>
      <div className="crumbs">פרק {chap.num} — {chap.name} ⟵ <b>{sub.title}</b></div>
      <div className="ed-title">
        <h1 contentEditable suppressContentEditableWarning
            onBlur={(e) => onChangeTitle(e.currentTarget.innerText)}>{sub.title}</h1>
        {chap.discipline === 'ARCH' ? <span className="tag">אדריכלות</span> : null}
      </div>
      <p className="ed-sub">{base} · {sub.clauses.length} סעיפים</p>
      <div className="ed-toolbar">
        <span className="chip" onClick={() => op(t => window.SpecTree.addAfter(t, null, 'paragraph').tree)}>＋ סעיף</span>
        <span className="chip" onClick={() => op(t => window.SpecTree.addAfter(t, null, 'standard').tree)}>＋ תקן (ת"י)</span>
      </div>
      <div className="doc">
        {sub.clauses.map(c => renderClause(c, 0))}
        <div className="add-clause top" onClick={() => op(t => window.SpecTree.addAfter(t, null, 'paragraph').tree)}>＋ הוסף סעיף</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  // Compile the JSX app with the classic runtime (React.createElement) so it works
  // with the UMD React globals — the automatic runtime would inject an ES import.
  (function () {
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(out);
  })();
</script>
</body>
