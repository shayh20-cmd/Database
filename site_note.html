        <option value="">ללא נושא</option>
        {groups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
      </select>
      <button className="group-btn del" onClick={() => onDelete(task.id)} aria-label="מחיקה"><IconTrash /></button>
    </div>
  );
}

/* ============================== Tasks Screen (capture + organize) ============================== */
function TasksScreen({ report, updateReport, onOpenTask, onNewTask }) {
  const { confirm } = useDialog();
  const [dragInfo, setDragInfo] = useState(null); // {listKey, index}

  const groups = report.groups.slice().sort((a, b) => a.order - b.order);
  const tasksByGroup = (groupId) => report.tasks.filter((t) => (t.groupId || null) === groupId).sort((a, b) => a.order - b.order);
  const ungrouped = tasksByGroup(null);

  function setTasks(newTasks) { updateReport({ ...report, tasks: newTasks }); }
  function setGroups(newGroups) { updateReport({ ...report, groups: newGroups }); }

  function addGroup(name) {
    const g = { id: uid(), name: name, order: groups.length };
    setGroups(groups.concat([g]));
  }
  function renameGroup(id, name) { setGroups(groups.map((g) => (g.id === id ? { ...g, name } : g))); }
  async function deleteGroup(id) {
    if (!(await confirm('למחוק את הנושא? המשימות בתוכו יעברו ל"ללא נושא".'))) return;
    updateReport({
      ...report,
      groups: groups.filter((g) => g.id !== id),
      tasks: report.tasks.map((t) => (t.groupId === id ? { ...t, groupId: null } : t)),
    });
  }
  function moveGroup(id, dir) {
    const idx = groups.findIndex((g) => g.id === id);
    const swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= groups.length) return;
    const reordered = moveItem(groups, idx, swapIdx).map((g, i) => ({ ...g, order: i }));
    setGroups(reordered);
  }

  function reassignTask(taskId, groupId) {
    const targetList = tasksByGroup(groupId);
    setTasks(report.tasks.map((t) => (t.id === taskId ? { ...t, groupId, order: targetList.length } : t)));
  }
  async function deleteTask(taskId) {
    if (!(await confirm('למחוק את המשימה?'))) return;
    setTasks(report.tasks.filter((t) => t.id !== taskId));
  }

  function handleDragStart(listKey, index) { setDragInfo({ listKey, index }); }
  function handleDragOverList(listKey, hoverIndex) {
    if (!dragInfo) return;
    if (dragInfo.listKey === listKey) {
      if (dragInfo.index === hoverIndex) return;
      const groupKey = listKey === '__ungrouped__' ? null : listKey;
      const list = listKey === '__ungrouped__' ? ungrouped : tasksByGroup(listKey);
      const reordered = moveItem(list, dragInfo.index, hoverIndex).map((t, i) => ({ ...t, order: i }));
      const otherTasks = report.tasks.filter((t) => (t.groupId || null) !== groupKey);
      setTasks(otherTasks.concat(reordered));
      setDragInfo({ listKey, index: hoverIndex });
      return;
    }

    // moving between two different groups
    const sourceGroupKey = dragInfo.listKey === '__ungrouped__' ? null : dragInfo.listKey;
    const targetGroupKey = listKey === '__ungrouped__' ? null : listKey;
    const sourceList = dragInfo.listKey === '__ungrouped__' ? ungrouped : tasksByGroup(dragInfo.listKey);
    const draggedTask = sourceList[dragInfo.index];
    if (!draggedTask) return;

    const newSourceList = sourceList.filter((t) => t.id !== draggedTask.id).map((t, i) => ({ ...t, order: i }));
    const targetList = (listKey === '__ungrouped__' ? ungrouped : tasksByGroup(listKey)).slice();
    const clampedIndex = Math.min(hoverIndex, targetList.length);
    targetList.splice(clampedIndex, 0, { ...draggedTask, groupId: targetGroupKey });
    const newTargetList = targetList.map((t, i) => ({ ...t, order: i }));

    const otherTasks = report.tasks.filter((t) => {
      const g = t.groupId || null;
      return g !== sourceGroupKey && g !== targetGroupKey;
    });
    setTasks(otherTasks.concat(newSourceList, newTargetList));
    setDragInfo({ listKey, index: clampedIndex });
  }
  function handleDragEnd() { setDragInfo(null); }

  // Pointer-Events-based drag (works on touch and mouse alike — native HTML5
  // draggable/dragover does not fire from touch input on most mobile browsers).
  // The handler below is attached once per gesture via window listeners, so it
  // reads handleDragOverList through a ref kept fresh on every render instead
  // of closing over a single (potentially stale) render's version.
  const handleDragOverListRef = useRef(handleDragOverList);
  handleDragOverListRef.current = handleDragOverList;

  function findDropTarget(clientY) {
    const emptyGroups = document.querySelectorAll('[data-empty-group]');
    for (const el of emptyGroups) {
      const r = el.getBoundingClientRect();
      if (clientY >= r.top && clientY <= r.bottom) return { listKey: el.getAttribute('data-empty-group'), index: 0 };
    }
    // Find the row closest to the pointer (by distance to its vertical midpoint), then
    // decide before/after based on which side of that specific row the pointer is on.
    // Scanning for the first row whose midpoint is below the pointer would instead pick
    // whichever row happens to satisfy that first — which can resolve to the wrong group
    // when the pointer sits right at a row's boundary.
    const rows = document.querySelectorAll('[data-org-row]');
    let closest = null, closestDist = Infinity;
    for (const el of rows) {
      const r = el.getBoundingClientRect();
      const mid = r.top + r.height / 2;
      const dist = Math.abs(clientY - mid);
      if (dist < closestDist) {
        closestDist = dist;
        closest = { listKey: el.getAttribute('data-list-key'), index: Number(el.getAttribute('data-index')), mid };
      }
    }
    if (!closest) return null;
    return { listKey: closest.listKey, index: clientY < closest.mid ? closest.index : closest.index + 1 };
  }

  function onDragHandleDown(e, listKey, index) {
    e.preventDefault();
    handleDragStart(listKey, index);
    function onMove(ev) {
      const target = findDropTarget(ev.clientY);
      if (target) handleDragOverListRef.current(target.listKey, target.index);
    }
    function onUp() {
      handleDragEnd();
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  const [newGroupName, setNewGroupName] = useState('');

  function renderList(listKey, list) {
    return list.map((t, i) => (
      <OrgRow
        key={t.id}
        task={t} index={i} listKey={listKey} groups={groups}
        dragging={dragInfo && dragInfo.listKey === listKey && dragInfo.index === i}
        onDragHandleDown={onDragHandleDown}
        onOpen={onOpenTask} onReassign={reassignTask} onDelete={deleteTask}
      />
    ));
  }

  if (report.tasks.length === 0) {
    return (
      <>
        <div className="empty-state">
          <IconClipboard />
          <h3>עדיין לא נוספו משימות</h3>
          <p>הקישו על כפתור ה-+ כדי לתעד את המשימה הראשונה מהסיור</p>
        </div>
        <button className="fab" onClick={onNewTask} aria-label="הוספת משימה"><IconPlus /></button>
      </>
    );
  }

  return (
    <>
      <div className="organize-wrap">
        <div className="organize-actions" style={{ marginBottom: 20 }}>
          <input className="field-input" style={{ flex: 1, minWidth: 140 }} placeholder="שם נושא חדש" value={newGroupName} onChange={(e) => setNewGroupName(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && newGroupName.trim()) { addGroup(newGroupName.trim()); setNewGroupName(''); } }} />
          <button className="btn btn-primary btn-sm" onClick={() => { if (newGroupName.trim()) { addGroup(newGroupName.trim()); setNewGroupName(''); } }}><IconPlus />הוספה</button>
        </div>

        {groups.map((g, gi) => {
          const list = tasksByGroup(g.id);
          return (
            <div className="group-section" key={g.id}>
              <div className="group-header">
                <input className="group-name-input" value={g.name} onChange={(e) => renameGroup(g.id, e.target.value)} />
                <span className="group-count">{list.length}</span>
                <button className="group-btn" onClick={() => moveGroup(g.id, -1)} disabled={gi === 0} aria-label="הזז למעלה"><IconUp /></button>
                <button className="group-btn" onClick={() => moveGroup(g.id, 1)} disabled={gi === groups.length - 1} aria-label="הזז למטה"><IconDown /></button>
                <button className="group-btn del" onClick={() => deleteGroup(g.id)} aria-label="מחיקת נושא"><IconTrash /></button>
              </div>
              <div className="group-body">
                {list.length === 0 ? <div className="group-empty" data-empty-group={g.id}>גררו משימות לכאן או בחרו נושא זה מהתפריט</div> : renderList(g.id, list)}
              </div>
            </div>
          );
        })}

        {groups.length === 0 ? (
          <div className="group-section">
            <div className="group-body">{renderList('__ungrouped__', ungrouped)}</div>
          </div>
        ) : ungrouped.length > 0 ? (
          <div className="group-section">
            <div className="group-header">
              <span className="group-name-static">ללא נושא</span>
              <span className="group-count">{ungrouped.length}</span>
            </div>
            <div className="group-body">
              {renderList('__ungrouped__', ungrouped)}
            </div>
          </div>
        ) : null}
      </div>
      <button className="fab" onClick={onNewTask} aria-label="הוספת משימה"><IconPlus /></button>
    </>
  );
}

function parseInlineMarkup(text) {
  const parts = [];
  const regex = /\*\*(.+?)\*\*|__(.+?)__/g;
  let lastIndex = 0, m, key = 0;
  while ((m = regex.exec(text))) {
    if (m.index > lastIndex) parts.push(text.slice(lastIndex, m.index));
    if (m[1] !== undefined) parts.push(<b key={key++}>{m[1]}</b>);
    else parts.push(<u key={key++}>{m[2]}</u>);
    lastIndex = regex.lastIndex;
  }
  if (lastIndex < text.length) parts.push(text.slice(lastIndex));
  return parts;
}

function TaskTextBlock({ text }) {
  const lines = (text || '').split('\n').map((l) => l.trim()).filter(Boolean);
  if (lines.length === 0) return <span className="doc-task-text">ללא תיאור</span>;
  if (lines.length === 1 && !/^(\d+\.\s|•\s)/.test(lines[0])) {
    return <span className="doc-task-text">{parseInlineMarkup(lines[0])}</span>;
  }
  const isNumbered = lines.some((l) => /^\d+\.\s/.test(l));
  const ListTag = isNumbered ? 'ol' : 'ul';
  return (
    <ListTag className="doc-task-list">
      {lines.map((line, i) => <li key={i}>{parseInlineMarkup(line.replace(/^(\d+\.\s|•\s)/, ''))}</li>)}
    </ListTag>
  );
}

function DocPhoto({ photo, onOpen, onResize }) {
  const [size, setSize] = useState({ w: photo.docW || 150, h: photo.docH || 112 });
  useEffect(() => { setSize({ w: photo.docW || 150, h: photo.docH || 112 }); }, [photo.docW, photo.docH]);
  const dragRef = useRef(null);

  function handlePointerDown(e) {
    e.stopPropagation();
    dragRef.current = { startX: e.clientX, startY: e.clientY, startW: size.w, startH: size.h };
    e.currentTarget.setPointerCapture(e.pointerId);
  }
  function handlePointerMove(e) {
    if (!dragRef.current) return;
    const { startX, startY, startW, startH } = dragRef.current;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    // Scale both dimensions uniformly (distance from the fixed top-left corner to the
    // pointer vs. to the original bottom-right corner) so the box's aspect ratio never
    // changes mid-resize — otherwise object-fit: cover would shift the crop as the box's
    // own ratio drifted from the image's.
    const origDist = Math.hypot(startW, startH);
    const newDist = Math.hypot(startW + dx, startH + dy);
    const rawScale = newDist / origDist;
    const minScale = Math.max(70 / startW, 52 / startH);
    const maxScale = Math.min(480 / startW, 480 / startH);
    const scale = Math.min(Math.max(rawScale, minScale), maxScale);
    setSize({ w: Math.round(startW * scale), h: Math.round(startH * scale) });
  }
  function handlePointerUp(e) {
    if (!dragRef.current) return;
    dragRef.current = null;
    onResize(photo.id, size.w, size.h);
  }

  return (
    <div className="doc-photo" style={{ width: size.w, height: size.h }} onClick={onOpen}>
      <div className="doc-photo-frame"><img src={displaySrc(photo)} alt="" /></div>
      <span
        className="doc-photo-resize"
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
        onClick={(e) => e.stopPropagation()}
        aria-label="שינוי גודל תמונה"
      />
    </div>
  );
}

/* ============================== A4 pagination ==============================
 * The on-screen preview is meant to always look like real, stacked A4 pages —
 * not one endlessly-tall scrolling block. We measure every atomic "unit" of
 * content (a header block, a task card, a table row, an appendix item) in a
 * hidden off-screen pass, then bucket them into pages that fit a fixed A4
 * content-height budget, and finally render the real, visible pages from
 * that grouping. A unit is never split across pages. */
const A4_PAGE_WIDTH = 794;
const A4_CONTENT_WIDTH = A4_PAGE_WIDTH - 30 * 2;
const A4_CONTENT_HEIGHT = 950; // conservative vs. the real print page's tighter margins

function pagesEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i].length !== b[i].length) return false;
    for (let j = 0; j < a[i].length; j++) if (a[i][j] !== b[i][j]) return false;
  }
  return true;
}

function usePagedUnits(units, contentHeight) {
  const [pages, setPages] = useState(null);
  const refsRef = useRef([]);

  useLayoutEffect(() => {
    const heights = units.map((u, i) => (refsRef.current[i] ? refsRef.current[i].offsetHeight : 0));
    let result = [];
    let current = [];
    let currentHeight = 0;
    units.forEach((u, i) => {
      const h = heights[i] || 0;
      const forcePage = u.breakBefore === 'page' && current.length > 0;
      const wouldOverflow = current.length > 0 && currentHeight + h > contentHeight;
      if (forcePage || wouldOverflow) {
        result.push(current);
        current = [];
        currentHeight = 0;
      }
      current.push(i);
      currentHeight += h;
    });
    if (current.length > 0) result.push(current);

    // A lone group title must never be the last thing on a page with none of
    // its tasks alongside it — push it onto the following page instead.
    for (let p = 0; p < result.length - 1; p++) {
      const page = result[p];
      const lastIdx = page[page.length - 1];
      if (page.length > 0 && units[lastIdx] && units[lastIdx].isGroupTitle) {
        page.pop();
        result[p + 1].unshift(lastIdx);
      }
    }
    result = result.filter((p) => p.length > 0);

    setPages((prev) => (pagesEqual(prev, result) ? prev : result));
  });

  const setRef = (i) => (el) => { refsRef.current[i] = el; };
  return { pages, setRef };
}

/* ============================== Preview / PDF Screen ============================== */
const ZOOM_LEVELS = [1, 0.85, 0.7, 0.55, 0.4];

function PreviewScreen({ report, updateReport }) {
  const { notify } = useDialog();
  const [lightboxSrc, setLightboxSrc] = useState(null);
  const [zoomIndex, setZoomIndex] = useState(0);
  const zoom = ZOOM_LEVELS[zoomIndex];
  function zoomOut() { setZoomIndex((i) => Math.min(ZOOM_LEVELS.length - 1, i + 1)); }
  function zoomIn() { setZoomIndex((i) => Math.max(0, i - 1)); }
  const groups = report.groups.slice().sort((a, b) => a.order - b.order);
  const tasksByGroup = (groupId) => report.tasks.filter((t) => (t.groupId || null) === groupId).sort((a, b) => a.order - b.order);
  const ungrouped = tasksByGroup(null);
  const pad2 = (n) => String(n).padStart(2, '0');
  const layout = report.pdfLayout || 'cards';
  const showLocation = report.pdfShowLocation !== false;
  const photoAppendix = !!report.pdfPhotoAppendix;
  const showStatus = report.pdfShowStatus !== false;

  function resizePhoto(photoId, w, h) {
    updateReport({
      ...report,
      tasks: report.tasks.map((t) => ({
        ...t,
        photos: t.photos.map((p) => (p.id === photoId ? { ...p, docW: w, docH: h } : p)),
      })),
    });
  }

  const sections = groups.map((g) => ({ id: g.id, name: (g.name && g.name.trim()) || 'נושא ללא שם', tasks: tasksByGroup(g.id) })).filter((s) => s.tasks.length > 0);
  if (ungrouped.length > 0) sections.push({ id: '__ungrouped__', name: groups.length ? 'משימות נוספות' : 'משימות', tasks: ungrouped });

  const photoEntries = [];
  sections.forEach((sec, secIndex) => {
    sec.tasks.forEach((t, taskIndex) => {
      if (t.photos.length > 0) photoEntries.push({ sec, secIndex, t, taskIndex });
    });
  });

  function renderPhotos(photos) {
    return (
      <div className="doc-photos">
        {photos.map((p) => (
          <DocPhoto key={p.id} photo={p} onOpen={() => setLightboxSrc(displaySrc(p))} onResize={resizePhoto} />
        ))}
      </div>
    );
  }

  // The ordered list of atomic, unsplittable content units for the current
  // layout/settings — the pagination pass below groups these into real
  // A4-sized pages, exactly like a real paginated document would.
  const units = [];
  units.push({
    key: 'header',
    kind: 'div',
    render: () => (
      <>
        <div className="doc-header">
          <div>
            <div className="doc-header-brand"><IconClipboard />Site Note</div>
            <div className="doc-title">{reportTitle(report)}</div>
          </div>
          <div className="doc-header-right">
            {report.reportNumber && <div>מס' דוח: {report.reportNumber}</div>}
            <div>תאריך סיור: {formatDateHe(report.date)}</div>
            {report.inspector && <div>אדריכל: {report.inspector}</div>}
            <div>הופק: {formatDateHeFromTs(Date.now())}</div>
          </div>
        </div>
        {report.participants && <div className="doc-participants"><b>משתתפים בסיור:</b> {report.participants}</div>}
        {report.notes && <div className="doc-participants">{parseInlineMarkup(report.notes)}</div>}
      </>
    ),
  });

  if (report.tasks.length === 0) {
    units.push({ key: 'empty', kind: 'div', render: () => <div className="doc-empty-note">לא נוספו משימות עדיין</div> });
  } else if (layout === 'table') {
    sections.forEach((sec, secIndex) => {
      sec.tasks.forEach((t, taskIndex) => {
        const renderRow = (showLead, leadRowSpan, refCb) => (
          <tr key={t.id} ref={refCb}>
            {showLead && <td className="doc-table-num" rowSpan={leadRowSpan}>{pad2(secIndex + 1)}</td>}
            {showLead && <td className="doc-table-topic" rowSpan={leadRowSpan}>{sec.name}</td>}
            <td className="doc-table-desc">
              <span className="doc-table-item-num">{taskIndex + 1}.{pad2(secIndex + 1)}</span>
              <TaskTextBlock text={t.text} />
              {showLocation && ((t.floors && t.floors.length > 0) || t.location) && (
                <div className="doc-table-loc">
                  {t.floors && t.floors.length > 0 && <span>קומה: {t.floors.join(', ')}</span>}
                  {t.location && <span>מיקום: {t.location}</span>}
                </div>
              )}
              {!showStatus && t.carriedFromReportTitle && (
                <div className="doc-created-note">נוצרה בתאריך: {formatDateHeFromTs(t.createdAt)}</div>
              )}
              {!photoAppendix && t.photos.length > 0 && renderPhotos(t.photos)}
            </td>
            <td className="doc-table-assignee">{t.assignee || '—'}</td>
            <td className="doc-table-due">{t.dueDate ? formatDateHe(t.dueDate) : '—'}</td>
            {showStatus && (
              <td className="doc-table-status">
                <StatusBadge status={t.status} />
                {t.carriedFromReportTitle && (
                  <div className="doc-created-note">נוצרה בתאריך: {formatDateHeFromTs(t.createdAt)}</div>
                )}
              </td>
            )}
          </tr>
        );
        units.push({ key: 'row-' + t.id, kind: 'row', sectionId: sec.id, renderRow });
      });
    });
  } else {
    sections.forEach((sec, secIndex) => {
      units.push({
        key: 'title-' + sec.id, kind: 'div', isGroupTitle: true,
        render: () => <div className="doc-group-title">{pad2(secIndex + 1)}. {sec.name}</div>,
      });
      sec.tasks.forEach((t, taskIndex) => {
        units.push({
          key: 'task-' + t.id, kind: 'div',
          render: () => (
            <div className="doc-task">
              <div className="doc-task-head">
                <span className="doc-task-num">{pad2(secIndex + 1)}.{pad2(taskIndex + 1)}</span>
                {showStatus && <StatusBadge status={t.status} className="status-badge-inline" />}
                <TaskTextBlock text={t.text} />
              </div>
              <div className="doc-task-meta">
                {t.floors && t.floors.length > 0 && <span>קומה: <b>{t.floors.join(', ')}</b></span>}
                {t.location && <span>מיקום: <b>{t.location}</b></span>}
                {t.assignee && <span>אחראי: <b>{t.assignee}</b></span>}
                {t.dueDate && <span>תאריך יעד: <b>{formatDateHe(t.dueDate)}</b></span>}
              </div>
              {t.carriedFromReportTitle && (
                <div className="doc-created-note">נוצרה בתאריך: {formatDateHeFromTs(t.createdAt)}</div>
              )}
              {!photoAppendix && t.photos.length > 0 && renderPhotos(t.photos)}
            </div>
          ),
        });
      });
    });
  }

  if (photoAppendix && photoEntries.length > 0) {
    units.push({ key: 'appendix-title', kind: 'div', breakBefore: 'page', render: () => <div className="doc-appendix-title">נספח תמונות</div> });
    photoEntries.forEach(({ sec, secIndex, t, taskIndex }) => {
      units.push({
        key: 'appendix-' + t.id, kind: 'div',
        render: () => (
          <div className="doc-appendix-item">
            <div className="doc-appendix-item-head">
              {pad2(secIndex + 1)}.{pad2(taskIndex + 1)} · {sec.name}
              {showStatus && <StatusBadge status={t.status} className="status-badge-inline" style={{ marginInlineStart: 8 }} />}
            </div>
            {showLocation && ((t.floors && t.floors.length > 0) || t.location) && (
              <div className="doc-appendix-item-loc">
                {t.floors && t.floors.length > 0 && <span>קומה: {t.floors.join(', ')}</span>}
                {t.location && <span>מיקום: {t.location}</span>}
              </div>
            )}
            {t.carriedFromReportTitle && (
              <div className="doc-created-note">נוצרה בתאריך: {formatDateHeFromTs(t.createdAt)}</div>
            )}
            {renderPhotos(t.photos)}
          </div>
        ),
      });
    });
  }

  const { pages, setRef } = usePagedUnits(units, A4_CONTENT_HEIGHT);
  // `pages` can briefly hold indices computed for a *previous* units array
  // (e.g. the render right after switching cards<->table layout, before the
  // pagination effect has re-measured) — never trust it across a shape
  // change, fall back to one unpaginated page for that single render instead.
  const pagesValid = pages && pages.every((pg) => pg.every((i) => i >= 0 && i < units.length));
  const pageList = pagesValid ? pages : [units.map((_, i) => i)];
  const hasRowUnits = units.some((u) => u.kind === 'row');

  function handlePrint() {
    // window.print() is silently ignored inside a sandboxed iframe missing "allow-modals"
    // (e.g. this Artifact preview) — no exception, no callback, just nothing happening. The
    // only observable signal is whether the browser's own "beforeprint" event ever fires.
    let firedPrint = false;
    const onBeforePrint = () => { firedPrint = true; };
    window.addEventListener('beforeprint', onBeforePrint);
    window.print();
    setTimeout(() => {
      window.removeEventListener('beforeprint', onBeforePrint);
      if (!firedPrint) {
        notify('לא ניתן לפתוח את חלון ההדפסה מתוך התצוגה המוטמעת הזו. פתחו את האפליקציה בכרטיסיית דפדפן נפרדת (למשל דרך קישור משותף, או הריצו את הקובץ באופן עצמאי) ונסו שוב.');
      }
    }, 700);
  }

  return (
    <>
      <div className="preview-toolbar">
        <div className="preview-toolbar-controls">
          <div className="layout-toggle">
            <button className={"layout-btn" + (layout === 'cards' ? ' active' : '')} onClick={() => updateReport({ ...report, pdfLayout: 'cards' })}>כרטיסים</button>
            <button className={"layout-btn" + (layout === 'table' ? ' active' : '')} onClick={() => updateReport({ ...report, pdfLayout: 'table' })}>טבלה</button>
          </div>
          <label className="preview-loc-toggle">
            <input type="checkbox" checked={showLocation} onChange={(e) => updateReport({ ...report, pdfShowLocation: e.target.checked })} />
            הצג מיקום/קומה
          </label>
          <label className="preview-loc-toggle">
            <input type="checkbox" checked={photoAppendix} onChange={(e) => updateReport({ ...report, pdfPhotoAppendix: e.target.checked })} />
            נספח תמונות
          </label>
          <label className="preview-loc-toggle">
            <input type="checkbox" checked={showStatus} onChange={(e) => updateReport({ ...report, pdfShowStatus: e.target.checked })} />
            הצג סטטוס
          </label>
          <div className="zoom-controls">
            <button type="button" className="zoom-btn" onClick={zoomOut} disabled={zoomIndex === ZOOM_LEVELS.length - 1} aria-label="הקטנת תצוגה"><IconZoomOut /></button>
            <span className="zoom-level">{Math.round(zoom * 100)}%</span>
            <button type="button" className="zoom-btn" onClick={zoomIn} disabled={zoomIndex === 0} aria-label="הגדלת תצוגה"><IconZoomIn /></button>
          </div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={handlePrint}><IconPrint />הפקת PDF</button>
      </div>
      <div className="preview-scroll">
        <div className="doc-print-root" style={{ zoom }}>
          {pageList.map((idxs, pageIdx) => {
            const pageUnits = idxs.map((i) => units[i]);
            const rowUnits = pageUnits.filter((u) => u.kind === 'row');
            return (
              <div className="doc-page" key={'page-' + pageIdx}>
                {pageUnits.map((u) => (
                  u.kind === 'div' ? <React.Fragment key={u.key}>{u.render()}</React.Fragment> : null
                ))}
                {rowUnits.length > 0 && (
                  <div className="doc-table-scroll">
                    <table className="doc-table">
                      <thead>
                        <tr>
                          <th>מס'</th>
                          <th>נושא</th>
                          <th>תיאור</th>
                          <th>אחראי</th>
                          <th>תאריך יעד</th>
                          {showStatus && <th>סטטוס</th>}
                        </tr>
                      </thead>
                      <tbody>
                        {(() => {
                          const out = [];
                          let i = 0;
                          while (i < rowUnits.length) {
                            const sid = rowUnits[i].sectionId;
                            let j = i;
                            while (j < rowUnits.length && rowUnits[j].sectionId === sid) j++;
                            const runLen = j - i;
                            for (let k = i; k < j; k++) out.push(rowUnits[k].renderRow(k === i, runLen));
                            i = j;
                          }
                          return out;
                        })()}
                      </tbody>
                    </table>
                  </div>
                )}
                {pagesValid && <div className="doc-page-num">עמוד {pageIdx + 1} מתוך {pageList.length}</div>}
              </div>
            );
          })}
        </div>

        {/* Hidden off-screen measuring pass — comes AFTER the real pages in the
            DOM (so any ".doc-task"/".doc-table" query naturally finds the real,
            visible one first). Reuses the real .doc-page CSS so its width always
            matches the visible pages at any screen size / zoom level. Never
            seen, never clickable. */}
        <div className="doc-page" style={{ position: 'fixed', top: 0, left: -99999, visibility: 'hidden', pointerEvents: 'none' }} aria-hidden="true">
          {units.map((u, i) => (
            u.kind === 'div' ? <div key={u.key} ref={setRef(i)}>{u.render()}</div> : null
          ))}
          {hasRowUnits && (
            <table className="doc-table" style={{ width: '100%' }}>
              <tbody>
                {units.map((u, i) => (u.kind === 'row' ? u.renderRow(true, 1, setRef(i)) : null))}
              </tbody>
            </table>
          )}
        </div>
      </div>
      {lightboxSrc && (
        <div className="lightbox-backdrop" onClick={() => setLightboxSrc(null)}>
          <button className="lightbox-close" onClick={() => setLightboxSrc(null)} aria-label="סגירה"><IconClose /></button>
          <img className="lightbox-img" src={lightboxSrc} alt="" onClick={(e) => e.stopPropagation()} />
        </div>
      )}
    </>
  );
}

/* ============================== Report Workspace (shell for an open report) ============================== */
function ReportWorkspace({ report, updateReport, existingSiteNames, onBack, saveState }) {
  const [tab, setTab] = useState('tasks');
  const [taskOverlay, setTaskOverlay] = useState(null); // 'new' | taskId | null
  const [metaOpen, setMetaOpen] = useState(() => !report.siteName.trim());

  const floors = useMemo(() => {
    const s = [];
    report.tasks.forEach((t) => { (t.floors || []).forEach((f) => { if (s.indexOf(f) === -1) s.push(f); }); });
    return s;
  }, [report.tasks]);
  const floorPlan = useMemo(() => buildFloorList(report), [report.floorsAboveGround, report.floorsBelowGround]);
  const assignees = useMemo(() => {
    const s = DEFAULT_ASSIGNEES.slice();
    (report.assignees || []).forEach((a) => { if (s.indexOf(a) === -1) s.push(a); });
    report.tasks.forEach((t) => { if (t.assignee && s.indexOf(t.assignee) === -1) s.push(t.assignee); });
    return s;
  }, [report.tasks, report.assignees]);
  const sortedGroups = useMemo(() => report.groups.slice().sort((a, b) => a.order - b.order), [report.groups]);

  function createGroup(name) {
    const g = { id: uid(), name, order: report.groups.length };
    updateReport({ ...report, groups: report.groups.concat([g]) });
    return g;
  }

  function createAssignee(name) {
    if ((report.assignees || []).indexOf(name) === -1 && DEFAULT_ASSIGNEES.indexOf(name) === -1) {
      updateReport({ ...report, assignees: (report.assignees || []).concat([name]) });
    }
    return name;
  }

  function openNewTask() { setTaskOverlay('new'); }
  function openEditTask(id) { setTaskOverlay(id); }
  function closeTaskOverlay() { setTaskOverlay(null); }

  function saveTask(rawDraft) {
    const { _existing, ...draft } = rawDraft;
    let tasks;
    const exists = report.tasks.some((t) => t.id === draft.id);
    if (exists) {
      tasks = report.tasks.map((t) => (t.id === draft.id ? draft : t));
    } else {
      tasks = report.tasks.concat([{ ...draft, order: report.tasks.length }]);
    }
    updateReport({ ...report, tasks });
    setTaskOverlay(null);
  }
  function deleteTaskById(id) {
    updateReport({ ...report, tasks: report.tasks.filter((t) => t.id !== id) });
    setTaskOverlay(null);
  }

  const editingTask = taskOverlay && taskOverlay !== 'new' ? report.tasks.find((t) => t.id === taskOverlay) : null;
  const isNewTask = taskOverlay === 'new';

  const tabs = [
    { id: 'tasks', label: 'משימות', icon: IconClipboard },
    { id: 'preview', label: 'PDF', icon: IconFile },
  ];

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="topbar-row">
          <button className="topbar-icon-btn" onClick={onBack} aria-label="חזרה"><IconBack /></button>
          <div className="topbar-titles" onClick={() => setMetaOpen(true)}>
            <div className="topbar-title">{reportTitle(report)}</div>
            <div className="topbar-subtitle">
              <span className={"save-dot" + (saveState === 'saving' ? ' saving' : '') + (saveState === 'error' ? ' error' : '')} />
              {saveState === 'saving' ? 'שומר...' : saveState === 'error' ? 'שגיאה בשמירה — נסו לפנות מקום או להוריד תמונות' : 'נשמר'} · {formatDateHe(report.date)}
            </div>
          </div>
          <button className="topbar-icon-btn" onClick={() => setMetaOpen(true)} aria-label="פרטי דוח"><IconEdit /></button>
        </div>
      </div>

      <div className="main-scroll">
        {tab === 'tasks' && (
          <TasksScreen report={report} updateReport={updateReport} onOpenTask={openEditTask} onNewTask={openNewTask} />
        )}
        {tab === 'preview' && <PreviewScreen report={report} updateReport={updateReport} />}
      </div>

      <div className="bottom-nav">
        {tabs.map((tb) => (
          <button key={tb.id} className={"bottom-nav-item" + (tab === tb.id ? " active" : "")} onClick={() => setTab(tb.id)}>
            <tb.icon />{tb.label}
          </button>
        ))}
      </div>

      {(isNewTask || editingTask) && (
        <TaskEditor
          task={isNewTask ? newTask(report.tasks.length) : { ...editingTask, _existing: true }}
          floors={floors}
          floorPlan={floorPlan}
          assignees={assignees}
          groups={sortedGroups}
          onCreateGroup={createGroup}
          onCreateAssignee={createAssignee}
          onCancel={closeTaskOverlay}
          onSave={saveTask}
          onDelete={isNewTask ? null : () => deleteTaskById(editingTask.id)}
        />
      )}

      {metaOpen && (
        <ReportMetaEditor
          report={report}
          existingSiteNames={existingSiteNames}
          onCancel={() => setMetaOpen(false)}
          onSave={(meta) => { updateReport({ ...report, ...meta }); setMetaOpen(false); }}
        />
      )}
    </div>
  );
}

/* ============================== App Root ============================== */
function App() {
  const { confirm } = useDialog();
  const [reports, setReports] = useState(() => loadReports());
  const [openReportId, setOpenReportId] = useState(null);
  const [saveState, setSaveState] = useState('saved');
  const saveTimer = useRef(null);
  const cloud = useOneDriveSync(reports, setReports);

  useEffect(() => {
    setSaveState('saving');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      setSaveState(persistReports(reports) ? 'saved' : 'error');
    }, 350);
    return () => clearTimeout(saveTimer.current);
  }, [reports]);

  function createReport() {
    const r = newReport();
    setReports((prev) => prev.concat([r]));
    setOpenReportId(r.id);
  }
  async function deleteReport(id) {
    if (!(await confirm('למחוק את הדוח לצמיתות?'))) return;
    setReports((prev) => prev.filter((r) => r.id !== id));
  }
  async function createFollowUpReport(id) {
    const source = reports.find((r) => r.id === id);
    if (!source) return;
    const openCount = source.tasks.filter((t) => t.status !== 'closed').length;
    const message = openCount > 0
      ? `ליצור דוח המשך המבוסס על "${reportTitle(source)}"? ${openCount} משימות פתוחות יועברו אליו.`
      : `ליצור דוח המשך המבוסס על "${reportTitle(source)}"? אין בו כרגע משימות פתוחות להעברה.`;
    if (!(await confirm(message, { confirmLabel: 'יצירה', danger: false }))) return;
    const r = buildFollowUpReport(source);
    setReports((prev) => prev.concat([r]));
    setOpenReportId(r.id);
  }
  function updateReport(next) {
    setReports((prev) => prev.map((r) => (r.id === next.id ? { ...next, updatedAt: Date.now() } : r)));
  }

  const openReport = reports.find((r) => r.id === openReportId);
  const existingSiteNames = useMemo(() => {
    const s = [];
    reports.forEach((r) => { if (r.siteName && r.siteName.trim() && s.indexOf(r.siteName) === -1) s.push(r.siteName); });
    return s;
  }, [reports]);

  if (openReport) {
    return (
      <ReportWorkspace
        report={openReport}
        updateReport={updateReport}
        existingSiteNames={existingSiteNames}
        onBack={() => setOpenReportId(null)}
        saveState={saveState}
      />
    );
  }

  return (
    <HomeScreen
      reports={reports}
      onOpen={setOpenReportId}
      onCreate={createReport}
      onDelete={deleteReport}
      onFollowUp={createFollowUpReport}
      cloud={cloud}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DialogProvider><App /></DialogProvider>);
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
