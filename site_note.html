<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://unpkg.com/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<style>
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #FAFBFC;
  --border: #E4E6EA;
  --border-strong: #D3D6DC;
  --text: #16181C;
  --text-2: #5B5E66;
  --text-3: #9599A2;
  --accent: #2563EB;
  --accent-h: #1D4ED8;
  --accent-light: rgba(37,99,235,.08);
  --accent-light-2: rgba(37,99,235,.14);
  --green: #16A34A;
  --green-light: rgba(22,163,74,.1);
  --orange: #EA580C;
  --orange-light: rgba(234,88,12,.1);
  --red: #DC2626;
  --red-light: rgba(220,38,38,.1);
  --amber: #D97706;
  --amber-light: rgba(217,119,6,.1);
  --shadow-sm: 0 1px 3px rgba(20,20,30,.07), 0 1px 2px rgba(20,20,30,.04);
  --shadow-md: 0 4px 14px rgba(20,20,30,.09), 0 1px 4px rgba(20,20,30,.05);
  --shadow-lg: 0 10px 32px rgba(20,20,30,.14), 0 2px 8px rgba(20,20,30,.06);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --nav-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); }
body { font-family: 'Heebo', system-ui, sans-serif; color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
img { max-width: 100%; display: block; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#root { height: 100%; }

/* ───────────────────────── Shell ───────────────────────── */
.app-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding-top: var(--safe-t);
  box-shadow: var(--shadow-sm);
}
.topbar-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-height: 56px; }
.topbar-icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: var(--text-2); flex-shrink: 0; transition: background .15s;
}
.topbar-icon-btn:hover { background: var(--surface-2); }
.topbar-titles { flex: 1; min-width: 0; }
.topbar-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-subtitle { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.save-dot.saving { background: var(--amber); animation: pulse 1s infinite; }
.save-dot.error { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.brand-mark { display: flex; align-items: center; gap: 9px; }
.brand-badge {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
  display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
}
.brand-name { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
.brand-name span { color: var(--accent); }

.ms-signin-btn {
  margin-inline-start: auto; display: flex; align-items: center; gap: 7px;
  padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
  background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--text-2); white-space: nowrap;
}
.ms-signin-btn:hover { background: var(--surface-2); }
.account-widget { position: relative; margin-inline-start: auto; }
.account-avatar-btn { display: flex; align-items: center; }
.account-avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0;
}
.account-avatar.syncing { animation: pulse 1.2s infinite; }
.account-menu {
  position: absolute; inset-inline-end: 0; top: calc(100% + 8px); z-index: 20;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); padding: 12px; min-width: 220px;
}
.account-menu-name { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-menu-email { font-size: 11.5px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-menu-status { font-size: 11.5px; color: var(--text-3); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.account-menu-status.error { color: var(--red); }
.account-menu-signout {
  margin-top: 10px; width: 100%; text-align: center; padding: 7px; border-radius: var(--radius-sm);
  background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--text-2);
}
.account-menu-signout:hover { background: var(--accent-light); color: var(--accent); }

.main-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ───────────────────────── Bottom nav ───────────────────────── */
.bottom-nav {
  position: sticky; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding-bottom: var(--safe-b); box-shadow: 0 -2px 10px rgba(20,20,30,.05);
}
.bottom-nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 4px 8px; color: var(--text-3); font-size: 11.5px; font-weight: 600; min-height: 52px;
  transition: color .15s;
}
.bottom-nav-item.active { color: var(--accent); }
.bottom-nav-item svg { width: 22px; height: 22px; }

/* ───────────────────────── Buttons ───────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 18px; border-radius: var(--radius-md); font-size: 14.5px; font-weight: 700;
  transition: all .15s; white-space: nowrap; border: 1px solid transparent;
}
.btn svg { width: 17px; height: 17px; flex-shrink: 0; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--accent-h); }
.btn-primary:disabled { background: var(--border-strong); color: var(--text-3); cursor: default; box-shadow: none; }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--red-light); color: var(--red); }
.btn-danger:hover { background: rgba(220,38,38,.18); }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 13px; border-radius: var(--radius-sm); }
.btn-icon-only { padding: 9px; }

.fab {
  position: fixed; left: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); z-index: 25;
  width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg);
  transition: transform .15s;
}
.fab:active { transform: scale(.93); }
.fab svg { width: 26px; height: 26px; }

/* ───────────────────────── Home screen ───────────────────────── */
.home-hero { padding: 22px 18px 6px; }
.home-hero h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
.home-hero p { color: var(--text-2); font-size: 13.5px; margin-top: 3px; }
.home-list { padding: 14px 18px 90px; display: flex; flex-direction: column; gap: 10px; }
.report-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 14px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm);
  transition: transform .12s, box-shadow .12s;
}
.report-card:active { transform: scale(.99); }
.report-card-icon {
  width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--accent-light);
  display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;
}
.report-card-icon svg { width: 22px; height: 22px; }
.report-card-body { flex: 1; min-width: 0; text-align: right; }
.report-card-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.report-card-meta { font-size: 12.5px; color: var(--text-3); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
.report-card-del, .report-card-followup {
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); width: 36px; height: 36px; padding: 8px; border-radius: 50%; flex-shrink: 0;
}
.report-card-del svg, .report-card-followup svg { width: 20px; height: 20px; }
.report-card-del:hover { color: var(--red); background: var(--red-light); }
.report-card-followup:hover { color: var(--accent); background: var(--accent-light); }
.empty-state { text-align: center; padding: 60px 24px; color: var(--text-3); }
.empty-state svg { width: 52px; height: 52px; margin: 0 auto 14px; opacity: .5; }
.empty-state h3 { color: var(--text-2); font-size: 15.5px; font-weight: 700; margin-bottom: 5px; }
.empty-state p { font-size: 13px; line-height: 1.5; }
.home-new-btn-wrap { padding: 4px 18px 10px; }
.home-sort-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 0 18px 10px; }
.home-sort-label { font-size: 12.5px; color: var(--text-3); }

/* ───────────────────────── Form fields ───────────────────────── */
.field { margin-bottom: 16px; }
.carried-note {
  display: flex; align-items: flex-start; gap: 8px; background: var(--accent-light); border: 1px solid var(--accent-light-2);
  border-radius: var(--radius-md); padding: 10px 12px; font-size: 12.5px; color: var(--accent-h); margin-bottom: 16px; line-height: 1.5;
}
.carried-note svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
.field-label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 7px; }
.field-label .opt { font-weight: 400; color: var(--text-3); }
.field-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.field-label-row .field-label { margin-bottom: 0; }
.text-toolbar { display: flex; gap: 4px; }
.text-toolbar-btn {
  width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); font-size: 13px;
}
.text-toolbar-btn svg { width: 15px; height: 15px; }
.text-toolbar-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent-light-2); }
.field-input, .field-textarea, .field-select {
  width: 100%; background: var(--surface-2); border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 12px 13px; font-size: 15px; color: var(--text); transition: border-color .15s, background .15s;
}
.field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--accent); background: var(--surface); }
.field-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.field-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.floor-divider { height: 1px; background: var(--border); margin: 10px 0; }
.two-col-row { display: flex; gap: 10px; }
.two-col-row > div { flex: 1; min-width: 0; }
.field-sublabel { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 5px; }

.new-group-link {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 8px;
  font-size: 12.5px; font-weight: 600; color: var(--accent);
}
.new-group-link svg { width: 15px; height: 15px; }
.new-group-row { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
.new-group-row .field-input { flex: 1; min-width: 0; }

.chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.chip {
  padding: 7px 13px; border-radius: 20px; background: var(--surface-2); border: 1.5px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--text-2); transition: all .12s;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.add-chip { color: var(--accent); border-style: dashed; border-color: var(--accent-light-2); background: var(--accent-light); }
.status-chip.active[data-status="open"] { background: #6B7280; border-color: #6B7280; color: #fff; }
.status-chip.active[data-status="in_progress"] { background: var(--amber); border-color: var(--amber); color: #fff; }
.status-chip.active[data-status="closed"] { background: var(--green); border-color: var(--green); color: #fff; }
.status-badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; border: 1px solid; flex-shrink: 0; }
.status-badge-inline { margin-inline-end: 6px; margin-bottom: 4px; }
.template-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 13px; }
.template-chip-apply { background: none; border: none; color: inherit; font: inherit; font-weight: 600; padding: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.template-chip-del { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; color: var(--text-3); flex-shrink: 0; }
.template-chip-del svg { width: 11px; height: 11px; }
.template-chip-del:hover { background: var(--red-light); color: var(--red); }

/* ───────────────────────── Custom dialog (confirm / alert) ───────────────────────── */
.dialog-backdrop {
  position: fixed; inset: 0; z-index: 200; background: rgba(15,17,21,.5);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .15s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dialog-box {
  background: var(--surface); border-radius: var(--radius-lg); padding: 20px;
  max-width: 320px; width: 100%; box-shadow: var(--shadow-lg);
}
.dialog-message { font-size: 14.5px; color: var(--text); line-height: 1.5; margin-bottom: 18px; text-align: center; }
.dialog-actions { display: flex; gap: 10px; }
.dialog-actions .btn { flex: 1; }

/* ───────────────────────── Full-screen overlay (task editor / meta / annotator) ───────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column; animation: slideUp .22s ease-out;
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.overlay-topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(var(--safe-t) + 12px) 14px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.overlay-title { font-size: 15.5px; font-weight: 700; }
.overlay-body { flex: 1; overflow-y: auto; padding: 18px 16px calc(var(--safe-b) + 30px); }
.overlay-body.no-pad { padding: 0; }

/* ───────────────────────── Photos ───────────────────────── */
.photo-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.photo-thumb {
  position: relative; width: 92px; height: 92px; border-radius: var(--radius-md); overflow: hidden;
  border: 1px solid var(--border); background: var(--surface-2); flex-shrink: 0;
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb-del {
  position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(20,20,30,.6); color: #fff; display: flex; align-items: center; justify-content: center;
}
.photo-thumb-del svg { width: 12px; height: 12px; }
.photo-thumb-badge {
  position: absolute; bottom: 4px; right: 4px; background: rgba(20,20,30,.6); color: #fff;
  border-radius: 6px; padding: 2px 5px; display: flex; align-items: center;
}
.photo-thumb-badge svg { width: 11px; height: 11px; }
.photo-add-tile {
  width: 92px; height: 92px; border-radius: var(--radius-md); border: 1.5px dashed var(--border-strong);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--accent); background: var(--accent-light); font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.photo-add-tile svg { width: 20px; height: 20px; }
.photo-add-actions { display: flex; gap: 10px; margin-top: 10px; }

/* ───────────────────────── Annotator ───────────────────────── */
.annotator { position: fixed; inset: 0; z-index: 60; background: #101114; display: flex; flex-direction: column; }
.annotator-top {
  display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-t) + 10px) 12px 10px;
  background: #17181C; flex-shrink: 0;
}
.annotator-top-btn { color: #fff; font-size: 14px; font-weight: 700; padding: 8px 10px; border-radius: 8px; }
.annotator-top-btn:hover { background: rgba(255,255,255,.08); }
.annotator-top-btn.save { color: #fff; background: var(--accent); }
.annotator-top-btn:disabled { opacity: .35; }
.annotator-canvas-wrap {
  flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 8px; position: relative;
}
.annotator-canvas-wrap canvas { touch-action: none; max-width: 100%; max-height: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.5); background: #000; }
.annotator-text-input {
  position: absolute; background: transparent; border: 1.5px dashed #fff; color: inherit; padding: 2px 4px;
  min-width: 40px; font-weight: 700; z-index: 5;
}
.annotator-toolbar { background: #17181C; padding: 10px 12px calc(var(--safe-b) + 10px); flex-shrink: 0; }
.annotator-tools-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
.tool-btn {
  width: 42px; height: 42px; border-radius: 10px; background: #24262B; color: #C7C9CF;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1.5px solid transparent;
}
.tool-btn svg { width: 20px; height: 20px; }

const MSAL_CLIENT_ID = '1b603a70-33a0-4f0f-8130-3d80b3b816a1';
const MSAL_TENANT_ID = '4dc3c008-379c-4600-a9d3-cea4feb564ad';
const MSAL_SCOPES = ['Files.ReadWrite.AppFolder', 'User.Read'];
const ONEDRIVE_FILE_NAME = 'sitenote-data.json';

let msalReadyPromise = null;
function getMsal() {
  if (!msalReadyPromise) {
    msalReadyPromise = (async () => {
      if (!window.msal) return null;
      const instance = new window.msal.PublicClientApplication({
        auth: {
          clientId: MSAL_CLIENT_ID,
          authority: 'https://login.microsoftonline.com/' + MSAL_TENANT_ID,
          redirectUri: window.location.origin + window.location.pathname,
        },
        cache: { cacheLocation: 'localStorage' },
      });
      await instance.initialize();
      return instance;
    })();
  }
  return msalReadyPromise;
}

async function msalGetAccount() {
  const msal = await getMsal();
  if (!msal) return null;
  const accounts = msal.getAllAccounts();
  if (accounts.length === 0) return null;
  msal.setActiveAccount(accounts[0]);
  return accounts[0];
}

async function msalSignIn() {
  const msal = await getMsal();
  if (!msal) throw new Error('ספריית ההתחברות לא נטענה');
  const result = await msal.loginPopup({ scopes: MSAL_SCOPES });
  msal.setActiveAccount(result.account);
  return result.account;
}

async function msalSignOut() {
  const msal = await getMsal();
  if (!msal) return;
  const account = msal.getActiveAccount();
  if (account) await msal.logoutPopup({ account });
}

async function msalGetToken() {
  const msal = await getMsal();
  if (!msal) throw new Error('ספריית ההתחברות לא נטענה');
  const account = msal.getActiveAccount() || (await msalGetAccount());
  if (!account) throw new Error('לא מחובר');
  try {
    const result = await msal.acquireTokenSilent({ scopes: MSAL_SCOPES, account });
    return result.accessToken;
  } catch (e) {
    const result = await msal.acquireTokenPopup({ scopes: MSAL_SCOPES, account });
    return result.accessToken;
  }
}

async function oneDriveUpload(data) {
  const token = await msalGetToken();
  const res = await fetch(
    'https://graph.microsoft.com/v1.0/me/drive/special/approot:/' + ONEDRIVE_FILE_NAME + ':/content',
    { method: 'PUT', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(data) }
  );
  if (!res.ok) throw new Error('העלאה ל-OneDrive נכשלה: ' + res.status);
  return res.json();
}

async function oneDriveDownload() {
  const token = await msalGetToken();
  const res = await fetch(
    'https://graph.microsoft.com/v1.0/me/drive/special/approot:/' + ONEDRIVE_FILE_NAME + ':/content',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('הורדה מ-OneDrive נכשלה: ' + res.status);
  return res.json();
}

// last-write-wins merge, per report, by updatedAt
function mergeReports(local, remote) {
  if (!remote || !Array.isArray(remote.reports)) return local;
  const byId = new Map(local.map((r) => [r.id, r]));
  remote.reports.forEach((rr) => {
    const lr = byId.get(rr.id);
    if (!lr || (rr.updatedAt || 0) > (lr.updatedAt || 0)) byId.set(rr.id, rr);
  });
  return Array.from(byId.values());
}

function useOneDriveSync(reports, setReports) {
  const [account, setAccount] = useState(null);
  const [status, setStatus] = useState('idle'); // idle | syncing | synced | error
  const [errorMsg, setErrorMsg] = useState('');
  const pushTimer = useRef(null);

  async function pullMerge() {
    setStatus('syncing'); setErrorMsg('');
    try {
      const remote = await oneDriveDownload();
      if (remote) setReports((prev) => mergeReports(prev, remote));
      setStatus('synced');
    } catch (e) {
      console.error(e);
      setStatus('error'); setErrorMsg('סנכרון נכשל');
    }
  }

  useEffect(() => {
    (async () => {
      try {
        const acc = await msalGetAccount();
        if (acc) { setAccount(acc); await pullMerge(); }
      } catch (e) { /* not signed in yet */ }
    })();
  }, []);

  useEffect(() => {
    if (!account) return;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(async () => {
      setStatus('syncing');
      try {
        await oneDriveUpload({ reports, syncedAt: Date.now() });
        setStatus('synced');
      } catch (e) {
        console.error(e);
        setStatus('error'); setErrorMsg('שמירה ל-OneDrive נכשלה');
      }
    }, 2000);
    return () => clearTimeout(pushTimer.current);
  }, [reports, account]);

  async function signIn() {
    setStatus('syncing'); setErrorMsg('');
    try {
      const acc = await msalSignIn();
      setAccount(acc);
      await pullMerge();
    } catch (e) {
      console.error(e);
      setStatus('error'); setErrorMsg('ההתחברות נכשלה או בוטלה');
    }
  }

  async function signOut() {
    await msalSignOut();
    setAccount(null);
    setStatus('idle');
  }

  return { account, status, errorMsg, signIn, signOut };
}

function buildFloorList(report) {
  const above = Math.max(0, Number(report.floorsAboveGround) || 0);
  const below = Math.max(0, Number(report.floorsBelowGround) || 0);
  if (above === 0 && below === 0) return { above: [], below: [] };
  const aboveList = ['קומת קרקע'];
  for (let i = 1; i <= above; i++) aboveList.push('קומה ' + i);
  const belowList = [];
  for (let i = 1; i <= below; i++) belowList.push('מרתף ' + i);
  return { above: aboveList, below: belowList };
}

function reportTitle(r) { return r.siteName && r.siteName.trim() ? r.siteName : 'דוח ללא שם'; }

function nextReportNumber(prev) {
  const trimmed = (prev || '').trim();
  const n = Number(trimmed);
  return trimmed && Number.isFinite(n) && String(n) === trimmed ? String(n + 1) : '';
}

function buildFollowUpReport(source) {
  const groupIdMap = {};
  const newGroups = source.groups.map((g) => {
    const newId = uid();
    groupIdMap[g.id] = newId;
    return { ...g, id: newId };
  });
  const openTasks = source.tasks.filter((t) => t.status !== 'closed');
  const newTasks = openTasks.map((t, i) => ({
    ...t,
    id: uid(),
    groupId: t.groupId ? (groupIdMap[t.groupId] || null) : null,
    order: i,
    photos: t.photos.map((p) => ({ ...p, id: uid() })),
    createdAt: t.createdAt, // preserve the task's true original creation date across every carry-over
    carriedFromReportTitle: reportTitle(source),
    carriedFromReportDate: source.date,
  }));
  return {
    ...newReport(),
    siteName: source.siteName,
    inspector: source.inspector,
    reportNumber: nextReportNumber(source.reportNumber),
    floorsAboveGround: source.floorsAboveGround || 0,
    floorsBelowGround: source.floorsBelowGround || 0,
    groups: newGroups,
    tasks: newTasks,
    previousReportId: source.id,
  };
}

function displaySrc(photo) { return (photo && (photo.annotatedSrc || photo.src)) || ''; }

/* Reorder helper: move item at `from` to `to` within array copy */
function moveItem(arr, from, to) {
  const copy = arr.slice();
  const [item] = copy.splice(from, 1);
  copy.splice(to, 0, item);
  return copy;
}

/* ============================== Dialogs (custom confirm/alert) =============================
   Native window.confirm/alert are silently swallowed inside a sandboxed iframe
   (e.g. the Claude Artifact preview) without "allow-modals" — confirm() always
   returns false and alert() shows nothing, so every delete button and every
   alert looked dead. These custom modals work everywhere, and read better in
   a touch-first app than native browser dialogs anyway. */
const DialogContext = React.createContext(null);

function DialogProvider({ children }) {
  const [dialog, setDialog] = useState(null); // { message, mode: 'confirm'|'alert', resolve }

  const confirm = useCallback((message, opts) => new Promise((resolve) => setDialog({ message, mode: 'confirm', resolve, confirmLabel: (opts && opts.confirmLabel) || 'מחיקה', danger: !opts || opts.danger !== false })), []);
  const notify = useCallback((message) => new Promise((resolve) => setDialog({ message, mode: 'alert', resolve })), []);

  function close(result) {
    if (dialog) dialog.resolve(result);
    setDialog(null);
  }

  return (
    <DialogContext.Provider value={{ confirm, notify }}>
      {children}
      {dialog && (
        <div className="dialog-backdrop" onClick={() => close(dialog.mode === 'confirm' ? false : undefined)}>
          <div className="dialog-box" onClick={(e) => e.stopPropagation()}>
            <div className="dialog-message">{dialog.message}</div>
            <div className="dialog-actions">
              {dialog.mode === 'confirm' ? (
                <>
                  <button className="btn btn-secondary" onClick={() => close(false)}>ביטול</button>
                  <button className={"btn " + (dialog.danger ? "btn-danger" : "btn-primary")} onClick={() => close(true)}>{dialog.confirmLabel}</button>
                </>
              ) : (
                <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => close()}>הבנתי</button>
              )}
            </div>
          </div>
        </div>
      )}
    </DialogContext.Provider>
  );
}
function useDialog() { return useContext(DialogContext); }

/* ============================== Photo Annotator ============================== */
const COLORS = ['#EF4444', '#F59E0B', '#22C55E', '#2563EB', '#FFFFFF', '#000000'];
const WIDTHS = { thin: 4, medium: 9, thick: 16 };
const FONT_SIZES = { thin: 26, medium: 38, thick: 54 };

function PhotoAnnotator({ photo, onCancel, onSave }) {
  const { confirm, notify } = useDialog();
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const imgRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [elements, setElements] = useState(photo.elements || []);
  const [tool, setTool] = useState('pen');
  const [color, setColor] = useState('#EF4444');
  const [widthKey, setWidthKey] = useState('medium');
  const drawingRef = useRef(null); // in-progress element
  const [textInput, setTextInput] = useState(null); // {cssX, cssY, canvasX, canvasY, value}

  useEffect(() => {
    const img = new Image();
    img.onload = () => {
      imgRef.current = img;
      const canvas = canvasRef.current;
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      setReady(true);
    };
    img.onerror = () => { notify('לא ניתן לטעון את התמונה לעריכה'); onCancel(); };
    img.src = photo.src;
  }, [photo.src]);

  const redraw = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas || !imgRef.current) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(imgRef.current, 0, 0, canvas.width, canvas.height);
    const all = drawingRef.current ? elements.concat([drawingRef.current]) : elements;
    all.forEach((el) => drawElement(ctx, el));
  }, [elements]);

  useEffect(() => { if (ready) redraw(); }, [ready, redraw]);

  function drawElement(ctx, el) {
    ctx.strokeStyle = el.color; ctx.fillStyle = el.color;
    ctx.lineWidth = el.width; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (el.type === 'path') {
      if (!el.points.length) return;
      ctx.beginPath();
      ctx.moveTo(el.points[0].x, el.points[0].y);
      el.points.forEach((pt) => ctx.lineTo(pt.x, pt.y));
      ctx.stroke();
    } else if (el.type === 'rect') {
      const x = Math.min(el.x1, el.x2), y = Math.min(el.y1, el.y2);
      ctx.strokeRect(x, y, Math.abs(el.x2 - el.x1), Math.abs(el.y2 - el.y1));
    } else if (el.type === 'ellipse') {
      const cx = (el.x1 + el.x2) / 2, cy = (el.y1 + el.y2) / 2;
      const rx = Math.abs(el.x2 - el.x1) / 2, ry = Math.abs(el.y2 - el.y1) / 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (el.type === 'arrow') {
      const { x1, y1, x2, y2 } = el;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = Math.max(14, el.width * 2.2);
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 7), y2 - headLen * Math.sin(angle - Math.PI / 7));
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 7), y2 - headLen * Math.sin(angle + Math.PI / 7));
      ctx.stroke();
    } else if (el.type === 'text') {
      ctx.font = `700 ${el.fontSize}px Heebo, sans-serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(el.text, el.x, el.y);
    }
  }

  function toCanvasPoint(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function handleTextClick(e) {
    if (!ready) return;
    const wrapRect = wrapRef.current.getBoundingClientRect();
    const pt = toCanvasPoint(e);
    setTextInput({ cssX: e.clientX - wrapRect.left, cssY: e.clientY - wrapRect.top, canvasX: pt.x, canvasY: pt.y, value: '' });
  }
  function handlePointerDown(e) {
    if (!ready || tool === 'text') return;
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
    const pt = toCanvasPoint(e);
    const base = { color, width: WIDTHS[widthKey] };
    if (tool === 'pen') drawingRef.current = { type: 'path', points: [pt], ...base };
    else if (tool === 'arrow') drawingRef.current = { type: 'arrow', x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y, ...base };
    else if (tool === 'rect') drawingRef.current = { type: 'rect', x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y, ...base };
    else if (tool === 'ellipse') drawingRef.current = { type: 'ellipse', x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y, ...base };
    redraw();
  }
  function handlePointerMove(e) {
    if (!drawingRef.current) return;
    const pt = toCanvasPoint(e);
    const d = drawingRef.current;
    if (d.type === 'path') d.points.push(pt);
    else { d.x2 = pt.x; d.y2 = pt.y; }
    redraw();
  }
  function handlePointerUp() {
    if (!drawingRef.current) return;
    const finished = drawingRef.current;
    drawingRef.current = null;
    setElements((prev) => prev.concat([finished]));
  }
  useEffect(() => { redraw(); }, [elements, redraw]);

  function commitText() {
    if (textInput && textInput.value.trim()) {
      setElements((prev) => prev.concat([{
        type: 'text', text: textInput.value, x: textInput.canvasX, y: textInput.canvasY,
        color, fontSize: FONT_SIZES[widthKey],
      }]));
    }
    setTextInput(null);
  }

  function undo() { setElements((prev) => prev.slice(0, -1)); }
  async function clearAll() {
    if (!elements.length) return;
    if (await confirm('למחוק את כל הסימונים בתמונה?')) setElements([]);
  }

  function handleSave() {
    const canvas = canvasRef.current;
    const finalSrc = canvas.toDataURL('image/jpeg', 0.85);
    onSave({ ...photo, elements, annotatedSrc: elements.length ? finalSrc : null });
  }

  const tools = [
    { id: 'pen', icon: IconPen, label: 'עט' },
    { id: 'arrow', icon: IconArrowTool, label: 'חץ' },
    { id: 'rect', icon: IconRect, label: 'מלבן' },
    { id: 'ellipse', icon: IconCircleTool, label: 'עיגול' },
    { id: 'text', icon: IconType, label: 'טקסט' },
  ];

  return (
    <div className="annotator">
      <div className="annotator-top">
        <button className="annotator-top-btn" onClick={onCancel}>ביטול</button>
        <div style={{ color: '#8B8E96', fontSize: 12.5, fontWeight: 700 }}>עריכת תמונה</div>
        <button className="annotator-top-btn save" onClick={handleSave}>שמירה</button>
      </div>
      <div className="annotator-canvas-wrap" ref={wrapRef}>
        <canvas
          ref={canvasRef}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerLeave={handlePointerUp}
          onClick={tool === 'text' ? handleTextClick : undefined}
        />
        {textInput && (
          <input
            autoFocus
            className="annotator-text-input"
            style={{ left: textInput.cssX, top: textInput.cssY, color, fontSize: Math.max(16, FONT_SIZES[widthKey] * 0.5) }}
            value={textInput.value}
            onChange={(e) => setTextInput({ ...textInput, value: e.target.value })}
            onBlur={commitText}
            onKeyDown={(e) => { if (e.key === 'Enter') commitText(); if (e.key === 'Escape') setTextInput(null); }}
          />
        )}
      </div>
      <div className="annotator-toolbar">
        <div className="annotator-tools-row">
          {tools.map((t) => (
            <button key={t.id} className={"tool-btn" + (tool === t.id ? " active" : "")} onClick={() => setTool(t.id)} aria-label={t.label}>
              <t.icon />
            </button>
          ))}
          <div className="tool-sep" />
          <button className="tool-btn" onClick={undo} aria-label="בטל" disabled={!elements.length} style={{ opacity: elements.length ? 1 : 0.35 }}><IconUndo /></button>
          <button className="tool-btn" onClick={clearAll} aria-label="נקה הכל" style={{ opacity: elements.length ? 1 : 0.35 }}><IconTrash /></button>
          <div className="tool-sep" />
          {COLORS.map((c) => (
            <button key={c} className={"color-sw" + (color === c ? " active" : "")} style={{ background: c, border: c === '#FFFFFF' ? '2px solid #444' : undefined }} onClick={() => setColor(c)} aria-label={c} />
          ))}
        </div>
        <div className="width-row">
          {Object.keys(WIDTHS).map((k, i) => (
            <button key={k} className={"width-btn" + (widthKey === k ? " active" : "")} onClick={() => setWidthKey(k)}>
              <span className="dot" style={{ width: 6 + i * 5, height: 6 + i * 5 }} />
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================== Task Editor ============================== */
function TaskEditor({ task, floors, floorPlan, assignees, groups, onCancel, onSave, onDelete, onCreateGroup, onCreateAssignee }) {
  const { notify } = useDialog();
  const [draft, setDraft] = useState(() => ({ ...task, photos: task.photos.map((p) => ({ ...p })) }));
  const [annotatingPhotoId, setAnnotatingPhotoId] = useState(null);
  const cameraInputRef = useRef(null);
  const galleryInputRef = useRef(null);
  const textareaRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const [templates, setTemplates] = useState(() => loadTemplates());
  const [addingGroup, setAddingGroup] = useState(false);
  const [newGroupName, setNewGroupName] = useState('');
  const [addingAssignee, setAddingAssignee] = useState(false);
  const [newAssigneeName, setNewAssigneeName] = useState('');

  function toggleFloor(f) {
    setDraft((d) => {
      const cur = d.floors || [];
      return { ...d, floors: cur.includes(f) ? cur.filter((x) => x !== f) : cur.concat([f]) };
    });
  }

  function submitNewGroup() {
    const name = newGroupName.trim();
    if (!name) return;
    const g = onCreateGroup(name);
    set('groupId', g.id);
    setNewGroupName('');
    setAddingGroup(false);
  }

  function submitNewAssignee() {
    const name = newAssigneeName.trim();
    if (!name) return;
    onCreateAssignee(name);
    set('assignee', name);
    setNewAssigneeName('');
    setAddingAssignee(false);
  }

  function set(field, value) { setDraft((d) => ({ ...d, [field]: value })); }

  function applyTemplate(t) { set('text', t.text); }
  function saveCurrentAsTemplate() {
    const text = (draft.text || '').trim();
    if (!text || templates.some((t) => t.text === text)) return;
    const next = templates.concat([{ id: uid(), text }]);
    setTemplates(next);
    persistTemplates(next);
  }
  function deleteTemplate(id) {
    const next = templates.filter((t) => t.id !== id);
    setTemplates(next);
    persistTemplates(next);
  }

  function wrapSelection(prefix, suffix) {
    const el = textareaRef.current;
    if (!el) return;
    const s = el.selectionStart, e = el.selectionEnd;
    const text = draft.text || '';
    const selected = text.slice(s, e);
    const newText = text.slice(0, s) + prefix + selected + suffix + text.slice(e);
    set('text', newText);
    requestAnimationFrame(() => {
      el.focus();
      el.setSelectionRange(s + prefix.length, s + prefix.length + selected.length);
    });
  }

  function applyListMarker(marker) {
    const el = textareaRef.current;
    if (!el) return;
    const text = draft.text || '';
    const s = el.selectionStart, e = el.selectionEnd;
    const lineStart = text.lastIndexOf('\n', s - 1) + 1;
    const nextBreak = text.indexOf('\n', e);
    const lineEnd = nextBreak === -1 ? text.length : nextBreak;
    const lines = text.slice(lineStart, lineEnd).split('\n');
    const newBlock = lines.map((line, i) => {
      const stripped = line.replace(/^(\d+\.\s|•\s)/, '');
      return (marker === 'number' ? `${i + 1}. ` : '• ') + stripped;
    }).join('\n');
    const newText = text.slice(0, lineStart) + newBlock + text.slice(lineEnd);
    set('text', newText);
    requestAnimationFrame(() => {
      el.focus();
      el.setSelectionRange(lineStart, lineStart + newBlock.length);
    });
  }

  async function handleFiles(fileList, openAnnotatorAfter) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setBusy(true);
    try {
      const added = [];
      for (const f of files) {
        const src = await downscaleImage(f);
        added.push({ id: uid(), src, elements: [], annotatedSrc: null });
      }
      setDraft((d) => ({ ...d, photos: d.photos.concat(added) }));
      if (openAnnotatorAfter && added.length === 1) setAnnotatingPhotoId(added[0].id);
    } catch (e) {
      notify('שגיאה בטעינת התמונה');
    } finally {
      setBusy(false);
    }
  }

  function removePhoto(id) {
    setDraft((d) => ({ ...d, photos: d.photos.filter((p) => p.id !== id) }));
  }
  function savePhotoAnnotation(updated) {
    setDraft((d) => ({ ...d, photos: d.photos.map((p) => (p.id === updated.id ? updated : p)) }));
    setAnnotatingPhotoId(null);
  }

  const annotatingPhoto = draft.photos.find((p) => p.id === annotatingPhotoId);
  if (annotatingPhoto) {
    return <PhotoAnnotator photo={annotatingPhoto} onCancel={() => setAnnotatingPhotoId(null)} onSave={savePhotoAnnotation} />;
  }

  return (
    <Overlay
      title={task._existing ? 'עריכת משימה' : 'משימה חדשה'}
      onClose={onCancel}
      onSave={() => onSave(draft)}
      saveLabel="שמירה"
    >
      {draft.carriedFromReportTitle && (
        <div className="carried-note">
          <IconFollowUp />
          <span>משימה זו הועברה מדוח "{draft.carriedFromReportTitle}" ({formatDateHe(draft.carriedFromReportDate)}) · נוצרה במקור בתאריך {formatDateHeFromTs(draft.createdAt)}</span>
        </div>
      )}
      <div className="field">
        <label className="field-label">נושא <span className="opt">(אופציונלי)</span></label>
        <select className="field-select" value={draft.groupId || ''} onChange={(e) => set('groupId', e.target.value || null)}>
          <option value="">ללא נושא</option>
          {groups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
        </select>
        {addingGroup ? (
          <div className="new-group-row">
            <input className="field-input" placeholder="שם נושא חדש" value={newGroupName} autoFocus
              onChange={(e) => setNewGroupName(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submitNewGroup(); if (e.key === 'Escape') { setAddingGroup(false); setNewGroupName(''); } }} />
            <button type="button" className="btn btn-primary btn-sm" onClick={submitNewGroup} disabled={!newGroupName.trim()}>הוספה</button>
            <button type="button" className="btn btn-secondary btn-sm" onClick={() => { setAddingGroup(false); setNewGroupName(''); }}>ביטול</button>
          </div>
        ) : (
          <button type="button" className="new-group-link" onClick={() => setAddingGroup(true)}><IconPlus />נושא חדש</button>
        )}
      </div>

      <div className="field">
        <div className="field-label-row">
          <label className="field-label">תיאור המשימה</label>
          <div className="text-toolbar">
            <button type="button" className="text-toolbar-btn" style={{ fontWeight: 800 }} onClick={() => wrapSelection('**', '**')} aria-label="הדגשה">B</button>
            <button type="button" className="text-toolbar-btn" style={{ textDecoration: 'underline' }} onClick={() => wrapSelection('__', '__')} aria-label="קו תחתון">U</button>
            <button type="button" className="text-toolbar-btn" onClick={() => applyListMarker('bullet')} aria-label="רשימת תבליטים"><IconListBullet /></button>
            <button type="button" className="text-toolbar-btn" onClick={() => applyListMarker('number')} aria-label="רשימה ממוספרת"><IconListNumber /></button>
            <button type="button" className="text-toolbar-btn" onClick={saveCurrentAsTemplate} disabled={!draft.text.trim()} aria-label="שמירה כתבנית"><IconBookmark /></button>
          </div>
        </div>
        <textarea ref={textareaRef} className="field-textarea" placeholder="לדוגמה: יש להשלים איטום בפינת הקיר הצפונית..." value={draft.text} onChange={(e) => set('text', e.target.value)} style={{ minHeight: 120 }} autoFocus />
        {templates.length > 0 && (
          <div className="chip-row">
            {templates.map((t) => (
              <span key={t.id} className="chip template-chip">
                <button type="button" className="template-chip-apply" onClick={() => applyTemplate(t)}>{t.text}</button>
                <button type="button" className="template-chip-del" onClick={() => deleteTemplate(t.id)} aria-label="מחיקת תבנית"><IconClose /></button>
              </span>
            ))}
          </div>
        )}
      </div>

      <div className="field">
        <label className="field-label">תמונות</label>
        <div className="photo-strip">
          {draft.photos.map((p) => (
            <div key={p.id} className="photo-thumb" onClick={() => setAnnotatingPhotoId(p.id)}>
              <img src={displaySrc(p)} alt="" />
              {p.annotatedSrc && <span className="photo-thumb-badge"><IconPen /></span>}
              <button className="photo-thumb-del" onClick={(e) => { e.stopPropagation(); removePhoto(p.id); }}><IconClose /></button>
            </div>
          ))}
          <button className="photo-add-tile" onClick={() => cameraInputRef.current.click()} disabled={busy}>
            <IconCamera /><span>מצלמה</span>
          </button>
        </div>
        <div className="photo-add-actions">
          <button className="btn btn-secondary btn-sm" onClick={() => galleryInputRef.current.click()} disabled={busy}>
            <IconImage />מהגלריה
          </button>
        </div>
        <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }}
          onChange={(e) => { handleFiles(e.target.files, true); e.target.value = ''; }} />
        <input ref={galleryInputRef} type="file" accept="image/*" multiple style={{ display: 'none' }}
          onChange={(e) => { handleFiles(e.target.files, false); e.target.value = ''; }} />
      </div>

      <div className="field">
        <label className="field-label">סטטוס</label>
        <div className="chip-row" style={{ marginTop: 0 }}>
          {STATUSES.map((s) => (
            <button key={s.id} type="button" data-status={s.id} className={"chip status-chip" + (draft.status === s.id ? " active" : "")} onClick={() => set('status', s.id)}>{s.label}</button>
          ))}
        </div>
      </div>

      <div className="field">
        <label className="field-label">קומה <span className="opt">(אופציונלי)</span></label>
        {(floorPlan.above.length > 0 || floorPlan.below.length > 0) ? (
          <>
            {floorPlan.above.length > 0 && (
              <div className="chip-row" style={{ marginTop: 0 }}>
                {floorPlan.above.map((f) => (
                  <button key={f} type="button" className={"chip" + ((draft.floors || []).includes(f) ? " active" : "")} onClick={() => toggleFloor(f)}>{f}</button>
                ))}
              </div>
            )}
            {floorPlan.below.length > 0 && (
              <>
                <div className="floor-divider" />
                <div className="chip-row" style={{ marginTop: 0 }}>
                  {floorPlan.below.map((f) => (
                    <button key={f} type="button" className={"chip" + ((draft.floors || []).includes(f) ? " active" : "")} onClick={() => toggleFloor(f)}>{f}</button>
                  ))}
                </div>
              </>
            )}
            <div className="field-hint">אפשר לבחור יותר מקומה אחת</div>
          </>
        ) : (
          <>
            <input className="field-input" placeholder="לדוגמה: קומה 3" value={(draft.floors && draft.floors[0]) || ''} onChange={(e) => set('floors', e.target.value ? [e.target.value] : [])} />
            {floors.length > 0 && (
              <div className="chip-row">
                {floors.map((f) => (
                  <button key={f} type="button" className={"chip" + ((draft.floors || []).includes(f) ? " active" : "")} onClick={() => set('floors', [f])}>{f}</button>
                ))}
              </div>
            )}
          </>
        )}
      </div>

      <div className="field">
        <label className="field-label">מיקום <span className="opt">(אופציונלי)</span></label>
        <input className="field-input" placeholder="לדוגמה: ממ״ד / חדר מדרגות" value={draft.location} onChange={(e) => set('location', e.target.value)} />
      </div>

      <div className="field">
        <label className="field-label">אחראי <span className="opt">(אופציונלי)</span></label>
        <input className="field-input" placeholder="שם הקבלן / בעל מקצוע" value={draft.assignee} onChange={(e) => set('assignee', e.target.value)} />
        {assignees.length > 0 && (
          <div className="chip-row">
            {assignees.map((a) => (
              <button key={a} type="button" className={"chip" + (draft.assignee === a ? " active" : "")} onClick={() => set('assignee', a)}>{a}</button>
            ))}
          </div>
        )}
        {addingAssignee ? (
          <div className="new-group-row">
            <input className="field-input" placeholder="שם אחראי חדש" value={newAssigneeName} autoFocus
              onChange={(e) => setNewAssigneeName(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submitNewAssignee(); if (e.key === 'Escape') { setAddingAssignee(false); setNewAssigneeName(''); } }} />
            <button type="button" className="btn btn-primary btn-sm" onClick={submitNewAssignee} disabled={!newAssigneeName.trim()}>הוספה</button>
            <button type="button" className="btn btn-secondary btn-sm" onClick={() => { setAddingAssignee(false); setNewAssigneeName(''); }}>ביטול</button>
          </div>
        ) : (
          <button type="button" className="new-group-link" onClick={() => setAddingAssignee(true)}><IconPlus />הוספת אחראי</button>
        )}
      </div>

      <div className="field">
        <label className="field-label">תאריך יעד <span className="opt">(אופציונלי)</span></label>
        <input type="date" className="field-input" value={draft.dueDate} onChange={(e) => set('dueDate', e.target.value)} />
      </div>

      {onDelete && (
        <button className="btn btn-danger btn-block" style={{ marginTop: 8 }} onClick={onDelete}>
          <IconTrash />מחיקת משימה
        </button>
      )}
    </Overlay>
  );
}

    const s = el.selectionStart, e = el.selectionEnd;
    const text = draft.notes || '';
    const selected = text.slice(s, e);
    const newText = text.slice(0, s) + prefix + selected + suffix + text.slice(e);
    setDraft((d) => ({ ...d, notes: newText }));

      el.focus();
      el.setSelectionRange(s + prefix.length, s + prefix.length + selected.length);

            </div>
            <div className="field-hint">בחרו פרויקט קיים מהרשימה, או הקלידו שם חדש</div>

        <input className="field-input" placeholder="לדוגמה: 12" value={draft.reportNumber} onChange={(e) => setDraft({ ...draft, reportNumber: e.target.value })} />
      </div>
      <div className="field">
        <label className="field-label">שם האדריכל <span className="opt">(אופציונלי)</span></label>
        <input className="field-input" placeholder="שם מלא" value={draft.inspector} onChange={(e) => setDraft({ ...draft, inspector: e.target.value })} />

      <div className="field">
        <label className="field-label">תאריך הסיור</label>
        <input type="date" className="field-input" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} />

      <div className="field">
        <label className="field-label">מבנה קומות <span className="opt">(אופציונלי)</span></label>
        <div className="two-col-row">
          <div>
            <label className="field-sublabel">קומות מעל הקרקע</label>
            <input type="number" min="0" className="field-input" value={draft.floorsAboveGround}
              onChange={(e) => setDraft({ ...draft, floorsAboveGround: Math.max(0, Number(e.target.value) || 0) })} />
          </div>
          <div>
            <label className="field-sublabel">קומות מתחת לקרקע</label>
            <input type="number" min="0" className="field-input" value={draft.floorsBelowGround}

/* ============================== Task Row (drag reorder) ============================== */
function OrgRowText({ text }) {
  const lines = (text || '').split('\n').map((l) => l.trim()).filter(Boolean);
  if (lines.length === 0) return <div className="org-row-text empty">ללא תיאור</div>;
  if (lines.length === 1 && !/^(\d+\.\s|•\s)/.test(lines[0])) {
    return <div className="org-row-text">{parseInlineMarkup(lines[0])}</div>;
  }
  const isNumbered = lines.some((l) => /^\d+\.\s/.test(l));
  const ListTag = isNumbered ? 'ol' : 'ul';
  return (
    <ListTag className="org-row-list">
      {lines.map((line, i) => <li key={i}>{parseInlineMarkup(line.replace(/^(\d+\.\s|•\s)/, ''))}</li>)}
    </ListTag>
  );
}

      ><IconGrip /></span>
      <div className="org-row-thumb">
        {task.photos[0] ? <img src={displaySrc(task.photos[0])} alt="" /> : <IconImage />}
      </div>
      <div className="org-row-body" onClick={() => onOpen(task.id)}>
        <OrgRowText text={task.text} />
        <div className="task-meta-row">
          <StatusBadge status={task.status} />
          {task.carriedFromReportTitle && (
            <span className="meta-pill carried-pill" title={'הועברה מדוח: ' + task.carriedFromReportTitle}>
              <IconFollowUp />נוצרה {formatDateHeFromTs(task.createdAt)}
            </span>
          )}
          {task.floors && task.floors.length > 0 && <span className="meta-pill"><IconLayer />{task.floors.join(', ')}</span>}
          {task.location && <span className="meta-pill"><IconMapPin />{task.location}</span>}
          {task.assignee && <span className="meta-pill"><IconUser />{task.assignee}</span>}
          {task.dueDate && <span className="meta-pill"><IconCalendar />{formatDateHe(task.dueDate)}</span>}
          {task.photos.length > 0 && <span className="meta-pill"><IconImage />{task.photos.length}</span>}
        </div>
