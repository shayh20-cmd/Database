<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לכידה מהירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#fff; --text:#1E1F21; --text-2:#4B5563; --text-3:#6B7280;
  --border:#E8EAED; --border-strong:#D2D6DB; --blue:#3B3FFA;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Heebo,'Segoe UI',system-ui,sans-serif; font-size:14px; line-height:1.45;
  display:flex; flex-direction:column;
}
.wrap{flex:1; display:flex; flex-direction:column; min-height:0}

header{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding:14px 18px 10px; border-bottom:1px solid var(--border); background:var(--surface);
}
header .proj{font-size:13px; font-weight:600; color:var(--text)}
header .hint{font-size:11px; color:var(--text-3)}

main{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:14px}

#text{
  width:100%; min-height:82px; resize:vertical; padding:11px 12px;
  border:1px solid var(--border-strong); border-radius:9px; background:var(--surface);
  color:var(--text); font-family:inherit; font-size:15px; line-height:1.45;
}
#text:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(59,63,250,.12)}
#text::placeholder{color:var(--text-3)}

.label{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-3); margin-bottom:6px}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.section{display:flex; flex-direction:column}
.section[hidden]{display:none}

button{font-family:inherit; cursor:pointer}
.tool{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:8px; padding:5px 11px; font-size:12px;
}
.tool:hover{border-color:var(--blue); color:var(--blue)}
.tool.rec{border-color:#dc2626; color:#dc2626}

.chip{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
  border-radius:999px; padding:4px 11px; font-size:12px; line-height:1.3;
}
.chip[aria-pressed="true"]{border-color:var(--blue); background:#EEF0FF; color:var(--blue); font-weight:600}

.pill{border-radius:999px; padding:4px 11px; font-size:12px; line-height:1.3; border:1px solid; background:transparent}
.pill[aria-pressed="true"]{font-weight:700}

.task{
  display:block; width:100%; text-align:start;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  border-radius:8px; padding:7px 11px; font-size:13px;
}
.task[aria-pressed="true"]{border-color:var(--blue); background:#EEF0FF; color:var(--blue); font-weight:600}

#where{font-size:12px; color:var(--text-2)}
#discSel{
  font-family:inherit; font-size:12px; padding:3px 7px; border-radius:6px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
}

footer{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 18px; border-top:1px solid var(--border); background:var(--surface);
}
footer .keys{font-size:11px; color:var(--text-3)}
#save{
  border:none; background:var(--blue); color:#fff; border-radius:8px;
  padding:8px 20px; font-size:13px; font-weight:600;
}
#save:disabled{background:var(--border-strong); color:var(--text-3); cursor:default}

#msg{font-size:12px; padding:0 18px 10px; color:#b91c1c}
#msg[hidden]{display:none}

#done{
  position:fixed; inset:0; background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:24px;
}
#done[hidden]{display:none}
#done .tick{font-size:34px; color:#059669; line-height:1}
#done .what{font-size:14px; font-weight:600; text-align:center}
#done .sub{font-size:12px; color:var(--text-3); text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="proj" id="proj">…</span>
    <span class="hint">Esc לסגירה</span>
  </header>

  <main>
    <textarea id="text" placeholder="מה קרה?" autofocus></textarea>

    <div class="row">
      <button class="tool" id="dictate" type="button">🎙 הכתבה</button>
      <button class="tool" id="paste" type="button">📋 הדבק מהמייל</button>
    </div>

    <div class="section">
      <div class="label">לאן</div>
      <div class="row">
        <span id="where">—</span>
        <select id="discSel" aria-label="תחום"></select>
      </div>
    </div>

    <div class="section" id="matchSec" hidden>
      <div class="label">משימות מתאימות</div>
      <div class="row" id="matches" style="flex-direction:column; align-items:stretch"></div>
    </div>

    <div class="section">
      <div class="label">סטטוס</div>
      <div class="row" id="pills"></div>
    </div>

    <div class="section">
      <div class="label">סוג</div>
      <div class="row" id="kinds"></div>
    </div>
  </main>

  <div id="msg" hidden></div>

  <footer>
    <span class="keys">Enter לשמור · Esc לסגור</span>
    <button id="save" type="button" disabled>שמור</button>
  </footer>
</div>

<div id="done" hidden>
  <div class="tick">✓</div>
  <div class="what" id="doneWhat"></div>
  <div class="sub" id="doneSub"></div>
</div>

<script>
'use strict';
var API = '/api/project-hub-01';

/* ---- mirrored logic (copy in tests/capture-logic.test.js) ---- */
/* Hints are matched against whole words, never raw substrings: "אש" sits inside
   "מאשרת" and "מים" inside "ההסכמים", so substring matching guessed nonsense.
   A hint of 4+ chars may match a word prefix (קונסטרוקצ → קונסטרוקציה);
   shorter ones must equal the word outright. */
const DISC_HINTS = [
  ['STRC', ['קונסטרוקצ','בטון','יסודות','שלד']],
  ['ELEC', ['חשמל','תאורה','מתח']],
  ['PLUM', ['אינסטלצ','סניטר','ביוב','ניקוז','מים']],
  ['SAFE', ['בטיחות','כיבוי','מתזים','ספרינקלר']],
  ['HVAC', ['מיזוג','אוורור','vrf']],
  ['TRAF', ['תנועה','חניה','חנייה','חניון']],
  ['LAND', ['נוף','גינון']],
  ['ACSS', ['נגישות']],
];
function stemWord(w){
  // Hebrew clitic prefixes (ה ו ב ל כ מ ש) glue onto nouns: "לקונסטרוקציה" vs "קונסטרוקציה".
  return (w.length >= 4 && 'הובלכמש'.indexOf(w[0]) !== -1) ? w.slice(1) : w;
}
function variantsOf(text){
  // One entry per word, holding the word and its stem. Stripping is ambiguous —
  // "הדמיות" begins with ה as part of the word — so both forms stay comparable.
  const out = [];
  (text||'').split(/\s+/).forEach(raw => {
    const w = raw.replace(/[^\u0590-\u05FF0-9A-Za-z]/g, '');
    if (w.length < 3) return;
    const s = stemWord(w);
    out.push(s === w ? [w] : [w, s]);
  });
  return out;
}
function matchTasks(text, tasks){
  const qs = variantsOf(text);
  if (!qs.length) return [];
  return (tasks||[])
    .filter(t => !t.done)
    .map(t => {
      const ts = new Set();
      variantsOf(t.title).forEach(v => v.forEach(x => ts.add(x)));
      return {t:t, score: qs.filter(v => v.some(x => ts.has(x))).length};
    })
    .filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score)   // most matching words first; ties keep list order
    .slice(0, 3)
    .map(x => x.t);
}
function guessDiscipline(text, disciplines){
  const has = id => (disciplines||[]).some(d => d.id === id);
  const words = [];
  variantsOf(text).forEach(v => v.forEach(w => words.push(w.toLowerCase())));
  for (const [id, hints] of DISC_HINTS) {
    if (!has(id)) continue;
    const hit = hints.some(h => words.some(w => w === h || (h.length >= 4 && w.indexOf(h) === 0)));
    if (hit) return id;
  }
  return has('ARCH') ? 'ARCH' : ((disciplines||[])[0]||{}).id || '';
}
function routeCapture({status, taskId, kind}){
  if (kind === 'principle') return 'principle';
  if (kind === 'task') return 'task';
  if (kind === 'update') return taskId ? 'update' : 'inbox';
  if (!status) return 'task';
  return taskId ? 'update' : 'inbox';
}
/* ---- end mirrored logic ---- */

/* Matches the app: uid() and todayISO() in project_hub_01.html.
   todayISO is UTC-based there, so it is UTC-based here — a capture must not
   date itself differently from an update logged in the app the same minute. */
function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* Status pills — mirrors EV_STATUSES/EV_CYCLE, minus `missing`. */
var STATUSES = [
  {id:'progress', label:'בעבודה',   symbol:'●', c:'#0c46e9', bg:'#bedbff', b:'#3280ff'},
  {id:'sent',     label:'נשלח',     symbol:'→', c:'#2e26ad', bg:'#c6d1ff', b:'#565afe'},
  {id:'response', label:'בהתייחסות', symbol:'⤴', c:'#813206', bg:'#fff189', b:'#ffd54a'},
  {id:'comments', label:'יש הערות',  symbol:'!', c:'#9e3d02', bg:'#ffe788', b:'#ffa101'},
  {id:'update',   label:'עדכון',     symbol:'✎', c:'#5814c3', bg:'#ece8ff', b:'#8753ff'},
  {id:'approved', label:'מאושר',     symbol:'✓', c:'#006549', bg:'#a0fad1', b:'#01c886'},
];
var KINDS = [
  {id:'update',    label:'עדכון'},
  {id:'task',      label:'משימה חדשה'},
  {id:'principle', label:'עקרון תכנון'},
];

var state = { text:'', disc:'', discTouched:false, taskId:null, status:null, kind:null, matches:[] };
var ctx = { projectName:'', disciplines:[], tasks:[], ready:false };

var $ = function(id){ return document.getElementById(id); };
function showMsg(t){ var m=$('msg'); if(!t){ m.hidden=true; m.textContent=''; return; } m.textContent=t; m.hidden=false; }

/* ---------- load ---------- */
async function load(){
  var d;
  try {
    var res = await fetch(API);
    if (!res.ok) throw new Error('HTTP '+res.status);
    d = await res.json();
  } catch (e) {
    showMsg('השרת לא פעיל — אפשר לכתוב, השמירה תנסה שוב.');
    $('proj').textContent = 'אין חיבור';
    return;
  }
  ctx.projectName = d.projectName || '';
  ctx.disciplines = d.disciplines || [];
  var sheet = (d.sheets||[]).find(function(s){ return s.type==='list' && s.track==null; });
  ctx.tasks = ((sheet||{}).tasks||[]).filter(function(t){ return !t.done && t.statusId!=='C'; });
  ctx.ready = true;
  $('proj').textContent = ctx.projectName;
  state.disc = guessDiscipline('', ctx.disciplines);
  renderDisc();
  render();
}

function discLabel(id){
  var d = ctx.disciplines.find(function(x){ return x.id===id; });
  return d ? (d.label || d.id) : id;
}

function renderDisc(){
  var sel = $('discSel');
  sel.innerHTML = '';
  ctx.disciplines.forEach(function(d){
    var o = document.createElement('option');
    o.value = d.id;                     // store the id
    o.textContent = d.label || d.id;    // show the label — they differ for some
    sel.appendChild(o);
  });
  sel.value = state.disc;
}

/* ---------- render ---------- */
function render(){
  var route = routeCapture(state);

  $('where').textContent = ctx.projectName
    ? ctx.projectName + (route==='inbox' ? ' · ממתין לשיוך' : '')
    : '—';
  $('discSel').value = state.disc;

  // matching tasks
  state.matches = matchTasks(state.text, ctx.tasks);
  // a selected task that no longer matches is no longer a valid target
  if (state.taskId && !state.matches.some(function(t){ return t.id===state.taskId; })) {
    state.taskId = null;
    route = routeCapture(state);
  }
  var sec = $('matchSec'), box = $('matches');
  sec.hidden = state.matches.length === 0;
  box.innerHTML = '';
  state.matches.forEach(function(t){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'task';
    b.setAttribute('aria-pressed', String(state.taskId === t.id));
    b.textContent = t.title || '(ללא כותרת)';
    b.onclick = function(){
      if (state.taskId === t.id) { state.taskId = null; }
      else { state.taskId = t.id; if (t.discipline) { state.disc = t.discipline; state.discTouched = true; } }
      render();
    };
    box.appendChild(b);
  });

  // status pills
  var pills = $('pills');
  pills.innerHTML = '';
  STATUSES.forEach(function(s){
    var on = state.status === s.id;
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pill';
    b.setAttribute('aria-pressed', String(on));
    b.style.borderColor = s.b;
    b.style.color = s.c;
    b.style.background = on ? s.bg : 'transparent';
    b.textContent = s.symbol + ' ' + s.label;
    b.onclick = function(){ state.status = on ? null : s.id; render(); };
    pills.appendChild(b);
  });

  // kind chips — the inferred kind shows pressed, one click overrides it
  var shown = route === 'inbox' ? 'update' : route;
  var kinds = $('kinds');
  kinds.innerHTML = '';
  KINDS.forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.setAttribute('aria-pressed', String(shown === k.id));
    b.textContent = k.label;
    b.onclick = function(){ state.kind = (state.kind === k.id) ? null : k.id; render(); };
    kinds.appendChild(b);
  });

  $('save').disabled = !state.text.trim();
}

/* ---------- save ---------- */
function summary(route){
  if (route === 'update') {
    var t = ctx.tasks.find(function(x){ return x.id === state.taskId; }) || {};
    return ['נשמר עדכון', t.title || ''];
  }
  if (route === 'task')      return ['נוצרה משימה חדשה', state.text.trim().slice(0,60)];
  if (route === 'principle') return ['נשמר כעקרון תכנון', discLabel(state.disc)];
  return ['נשמר — ממתין לשיוך', 'אפשר לשייך למשימה במסך מבט על'];
}

function applyCapture(d, route){
  var text = state.text.trim();
  if (route === 'update') {
    d.sheets = (d.sheets||[]).map(function(sh){
      if (sh.type !== 'list') return sh;
      return Object.assign({}, sh, { tasks: (sh.tasks||[]).map(function(t){
        if (t.id !== state.taskId) return t;
        var rec = { id:uid(), status:state.status||'progress', assignee:state.disc||'',
                    date:todayISO(), title:'', note:text };
        return Object.assign({}, t, { events: (t.events||[]).concat([rec]) });
      })});
    });
  } else if (route === 'task') {
    var target = (d.sheets||[]).find(function(s){ return s.type==='list' && s.track==null; });
    if (!target) throw new Error('לא נמצאה רשימת משימות שוטפות');
    var groupId = ((target.groups||[])[0]||{}).id || '';
    target.tasks = (target.tasks||[]).concat([{
      id:uid(), groupId:groupId, title:text, statusId:'N', priority:'',
      discipline:state.disc||'', startDate:'', dueDate:'', comment:'',
      done:false, subtasks:[], fieldValues:{}, events:[], tracks:[], assigneeId:''
    }]);
  } else if (route === 'principle') {
    d.standalonePrinciples = (d.standalonePrinciples||[]).concat([{
      id:uid(), description:text, discipline:state.disc||'', createdAt:todayISO()
    }]);
  } else {
    d.inbox = (d.inbox||[]).concat([{
      id:uid(), date:todayISO(), text:text, kind:'update',
      status:state.status||null, discipline:state.disc||''
    }]);
  }
  return d;
}

var saving = false;
async function doSave(){
  if (saving || !state.text.trim()) return;
  saving = true; showMsg('');
  var route = routeCapture(state);
  try {
    var res = await fetch(API);
    if (!res.ok) throw new Error('HTTP '+res.status);
    var d = await res.json();
    d = applyCapture(d, route);
    d._ts = Date.now();   // lets an open app tab notice this write
    var put = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)
    });
    if (!put.ok) throw new Error('HTTP '+put.status);
  } catch (e) {
    saving = false;
    // the text stays in the field — nothing typed is ever lost
    showMsg('לא נשמר: ' + (e && e.message === 'Failed to fetch' ? 'השרת לא פעיל' : (e.message||e)));
    return;
  }
  var s = summary(route);
  $('doneWhat').textContent = s[0];
  $('doneSub').textContent  = s[1];
  $('done').hidden = false;
  setTimeout(closeWindow, 2000);
}

function closeWindow(){
  window.close();
  // a tab the browser refuses to close should say so rather than look frozen
  setTimeout(function(){
    if (!document.hidden) {
      $('done').hidden = false;
      $('doneSub').textContent = 'אפשר לסגור את החלון';
    }
  }, 300);
}

/* ---------- wiring ---------- */
$('text').addEventListener('input', function(e){
  state.text = e.target.value;
  if (!state.discTouched) state.disc = guessDiscipline(state.text, ctx.disciplines);
  render();
});
$('text').addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSave(); }
});
$('discSel').addEventListener('change', function(e){
  state.disc = e.target.value; state.discTouched = true; render();
});
$('save').addEventListener('click', doSave);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeWindow(); });

$('paste').addEventListener('click', async function(){
  try {
    var t = await navigator.clipboard.readText();
    if (!t) return;
    var ta = $('text');
    ta.value = (ta.value ? ta.value + '\n' : '') + t.trim();
    ta.dispatchEvent(new Event('input'));
    ta.focus();
  } catch (e) { showMsg('אין גישה ללוח — אפשר להדביק עם Ctrl+V'); }
});

var recog = null;
$('dictate').addEventListener('click', function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showMsg('הכתבה אינה נתמכת בדפדפן הזה'); return; }
  var btn = this;
  if (recog) { recog.stop(); return; }
  recog = new SR();
  recog.lang = 'he-IL'; recog.interimResults = false; recog.continuous = false;
  btn.classList.add('rec'); btn.textContent = '⏹ עצור';
  recog.onresult = function(ev){
    var said = ev.results[0][0].transcript;
    var ta = $('text');
    ta.value = (ta.value ? ta.value + ' ' : '') + said;   // a draft, never saved unreviewed
    ta.dispatchEvent(new Event('input'));
  };
  recog.onerror = function(){ showMsg('ההכתבה נכשלה'); };
  recog.onend = function(){
    recog = null; btn.classList.remove('rec'); btn.textContent = '🎙 הכתבה'; $('text').focus();
  };
  recog.start();
});

load();
$('text').focus();
</script>
</body>
</html>
