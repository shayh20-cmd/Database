<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hub · כניסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0a2540; --blue-800:#12478f; --blue-700:#1450a3; --blue-600:#1d63c9; --blue-500:#2f7be0;
  --sky-400:#4fa3f0; --sky-300:#7cc4f5; --sky-100:#e3effc; --sky-50:#f3f8fe; --white:#ffffff;
  --ink:#0f2744; --muted:#5b7190; --line:#c9dcf2; --danger:#c62f3b;
  --radius-sm:8px; --radius-lg:18px; --radius-pill:999px;
  --shadow-card:0 30px 60px -20px rgba(10,37,64,.28), 0 8px 20px -8px rgba(10,37,64,.12);
  --font:"Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#e9f2fc;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg .grid{position:absolute;inset:-80px;opacity:.55;
  background-image:linear-gradient(rgba(29,99,201,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,99,201,.07) 1px,transparent 1px),
    linear-gradient(rgba(29,99,201,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(29,99,201,.035) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,16px 16px,16px 16px}
@keyframes drift{to{transform:translate(80px,80px)}}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg .wave1{fill:#1d63c9;opacity:.10}
.bg .wave2{fill:#4fa3f0;opacity:.12}
.bg .dim{stroke:#1d63c9;stroke-opacity:.18;stroke-width:1;fill:none;stroke-dasharray:6 6}
@keyframes sway1{to{transform:translate(-40px,20px) rotate(-4deg) scale(1.04)}}
@keyframes sway2{to{transform:translate(50px,-30px) rotate(5deg)}}
@keyframes dash{to{stroke-dashoffset:-240}}

/* ---------- logo ---------- */
.lockup{direction:ltr;display:inline-flex;align-items:center;gap:.42em;line-height:1}
.lockup .mark{width:1.9em;height:1.9em;flex:none;overflow:visible}
.lockup .word{font-weight:300;letter-spacing:.14em;font-size:1em;color:var(--navy-900);white-space:nowrap}
.lockup .word b{font-weight:800;letter-spacing:.08em;color:var(--blue-600)}
.mark .f-top{fill:var(--sky-300)} .mark .f-left{fill:var(--blue-600)} .mark .f-right{fill:var(--navy-900)}
.mark .node{fill:#fff;stroke:var(--blue-600);stroke-width:2.4}
.mark .outline{fill:none;stroke:var(--blue-600);stroke-width:1.4;stroke-linejoin:round;opacity:0}

/* intro */
.intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#e9f2fc;
  transition:background-color .7s ease}
.intro .lockup{font-size:44px;transform-origin:0 0;transition:transform .8s cubic-bezier(.65,0,.25,1)}
.intro .outline{opacity:1;stroke-dasharray:180;stroke-dashoffset:180;animation:draw 1.1s .1s cubic-bezier(.6,0,.3,1) forwards,fadeOut .5s 1.5s forwards}
.intro .face{transform-box:view-box;transform-origin:32px 31.8px;transform:scale(0);opacity:0;animation:pop .55s cubic-bezier(.3,1.5,.5,1) forwards}
.intro .f-top{animation-delay:.75s}.intro .f-left{animation-delay:.9s}.intro .f-right{animation-delay:1.05s}
.intro .node{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s 1.3s cubic-bezier(.3,1.8,.5,1) forwards}
.intro .word span{display:inline-block;opacity:0;transform:translateY(.35em);animation:letter .45s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(1.45s + var(--i) * 45ms)}
.intro .tag{position:absolute;top:calc(50% + 70px);font-size:14px;color:var(--muted);letter-spacing:.02em;opacity:0;animation:fadeIn .6s 2s forwards}
.intro.fly{background-color:rgba(233,242,252,0);pointer-events:none}
.intro.fly .tag{opacity:0;animation:none;transition:opacity .2s}
.intro.gone{display:none}
.intro .skip{position:absolute;bottom:24px;inset-inline-start:24px;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;opacity:.8}
.intro.fly .skip{display:none}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes letter{to{opacity:1;transform:none}}

/* ---------- card ---------- */
.card{position:relative;z-index:1;width:min(1000px,100%);min-height:600px;background:var(--white);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-card);display:grid;grid-template-columns:1.12fr 1fr;overflow:hidden;
  opacity:0;transform:translateY(24px) scale(.985);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.shown .card{opacity:1;transform:none}
.card .shape{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card .shape .main{fill:var(--blue-600)}
.card .shape .glass{fill:#fff;opacity:.12}

.hero{position:relative;color:#fff;padding:40px 36px 34px;display:flex;flex-direction:column;justify-content:flex-end;min-height:600px}
.welcome{position:absolute;top:34px;inset-inline-start:26px;writing-mode:vertical-rl;font-weight:800;font-size:64px;letter-spacing:.04em;
  line-height:1;color:#fff;opacity:.28;direction:ltr;user-select:none}
.illus{position:absolute;top:62px;left:-4%;width:86%;height:auto;overflow:visible}
.hero .tagline{position:relative;font-size:14px;letter-spacing:.06em;font-weight:500;max-width:300px;line-height:1.5}
.hero .tagline small{display:block;font-weight:300;opacity:.85;letter-spacing:.02em;font-size:13px}

.form-side{position:relative;padding:44px 48px 30px;padding-inline-start:40px;padding-inline-end:52px;display:flex;flex-direction:column}
.form-side .brand{font-size:21px;align-self:flex-start}
.form-side .brand.pending{visibility:hidden}
.form-side h1{margin-top:52px;font-size:30px;font-weight:800;color:var(--blue-600);letter-spacing:-.01em}
.form-side .sub{margin-top:6px;color:var(--muted);font-size:15px}
form{margin-top:34px;display:flex;flex-direction:column;gap:26px}
.field label{display:block;font-size:14px;font-weight:500;color:var(--blue-700);margin-bottom:4px}
.field .ctl{position:relative;display:flex;align-items:center;border-bottom:1.5px solid var(--line);transition:border-color .2s}
.field .ctl:focus-within{border-color:var(--blue-600)}
.field .ctl::after{content:"";position:absolute;bottom:-1.5px;right:0;height:2px;width:0;background:var(--blue-600);transition:width .35s ease}
.field .ctl:focus-within::after{width:100%}
.field input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:9px 0 9px 8px;min-width:0}
.field input::placeholder{color:#9db0c9}
.field input[type=email]{direction:ltr;text-align:right}
.field input[type=email]:not(:placeholder-shown){text-align:left}
.field .ico{width:20px;height:20px;color:var(--sky-400);flex:none}
.field .eye{background:none;border:0;padding:4px;cursor:pointer;color:var(--muted);display:flex;border-radius:6px}
.field .eye:focus-visible{outline:2px solid var(--blue-600)}
.field .err{font-size:13px;color:var(--danger);margin-top:6px;min-height:0;display:none}
.field.invalid .ctl{border-color:var(--danger)} .field.invalid .err{display:block}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:-6px}
.check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--ink);user-select:none}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #9dbbe0;display:grid;place-items:center;transition:all .2s;background:#fff}
.check .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s .05s}
.check input:checked + .box{background:var(--blue-600);border-color:var(--blue-600)}
.check input:checked + .box svg{stroke-dashoffset:0}
.check input:focus-visible + .box{outline:2px solid var(--blue-600);outline-offset:2px}
.link{color:var(--blue-600);font-size:14px;font-weight:500;text-decoration:none}
.link:hover{text-decoration:underline}

.btn{margin-top:6px;height:52px;border:0;border-radius:var(--radius-pill);background:var(--blue-600);color:#fff;font:inherit;font-size:17px;font-weight:700;
  cursor:pointer;box-shadow:0 12px 24px -10px rgba(29,99,201,.65);transition:transform .15s,box-shadow .2s,background .2s;position:relative;overflow:hidden}
.btn:hover{background:var(--blue-700);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--sky-300);outline-offset:3px}
.btn .spin{display:none;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:auto}
.btn.loading .lbl{display:none}.btn.loading .spin{display:block}
.btn.done{background:#177a52}
.btn .lbl{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn .ms{width:18px;height:18px;flex:none}
.mode-note{margin-top:-12px;font-size:13px;color:var(--muted);text-align:center}
.mode-note[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.foot{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.foot nav{display:flex;gap:18px}

/* illustration motion */
.illus .rise{opacity:0}
.ready .illus .rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) + .15s)}
.ready .illus .laptop{animation-name:riseLap}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes riseLap{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes swing{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
.illus{--c-top:#eaf3fd;--c-r:#b9d6f6;--c-l:#8ebcef;}
.illus polygon,.illus ellipse,.illus circle{stroke:#0b3a78;stroke-opacity:.18;stroke-width:.6;stroke-linejoin:round}
.illus .t{fill:#f4f9ff}.illus .r{fill:#cfe3fa}.illus .l{fill:#a9cdf5}
.illus .tb{fill:#e3effd}.illus .rb{fill:#8fc0f2}.illus .lb{fill:#5d9fe6}
.illus .t2{fill:#2f7be0}.illus .r2{fill:#1d63c9}.illus .l2{fill:#1450a3}
.illus .win{fill:#1d63c9;fill-opacity:.55;stroke:none}.illus .win-r{fill-opacity:.35}
.illus .deck{fill:#f7fbff}.illus .deck-r{fill:#c6dcf5}.illus .deck-l{fill:#a4c6ee}
.illus .kbd{fill:#e2edfa}.illus .kbd-l{stroke:#b6cfee;stroke-width:.8}
.illus .pad{fill:#e8f1fc}
.illus .lid{fill:#dbe9fa}.illus .lid-t{fill:#eef5fe}.illus .lid-r{fill:#b9d3f2}
.illus .screen{fill:#0e3a74}
.illus .ui-bar{fill:#1d63c9}.illus .ui-side{fill:#12478f}.illus .ui-card{fill:#1a56a8}
.illus .ui-line{stroke:#6fb0f3;stroke-width:1.4;stroke-linecap:round}
.illus .ui-grid{stroke:#4fa3f0;stroke-width:.8;stroke-opacity:.7}
.illus .bp{fill:#0f3f80}.illus .bp-edge{fill:#0a2d5e}
.illus .bp-l{stroke:#fff;stroke-width:1.6;stroke-linecap:square}.illus .bp-dim{stroke:#bfe0ff;stroke-width:.8;stroke-dasharray:3 2}
.illus .panel{fill:#fff}.illus .panel-edge{fill:#b9d3f2}
.illus .bar{fill:#8ebcef}.illus .bar-hi{fill:#1d63c9}
.illus .trend{fill:none;stroke:#0a2540;stroke-width:1.4;stroke-linejoin:round}
.illus .pie{fill:#fff}.illus .pie-edge{fill:#b9d3f2}.illus .pie-slice{fill:#1d63c9}.illus .pie-slice2{fill:#8ebcef}
.illus .crane-t{fill:#fff}.illus .crane-r{fill:#4fa3f0}.illus .crane-l{fill:#2f7be0}
.illus .lattice{stroke:#fff;stroke-width:.7;stroke-opacity:.8}
.illus .cable{stroke:#0a2540;stroke-width:.8;stroke-opacity:.6}
.illus .trunk{stroke:#1450a3;stroke-width:2.2;stroke-linecap:round}
.illus .crown{fill:#7cc4f5}.illus .crown-hl{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-opacity:.8}
.illus .shadow{fill:#0a2540;fill-opacity:.12;stroke:none}
.illus .gshadow{fill:#0a2540;fill-opacity:.14;stroke:none}
.illus .bp-edge2{fill:#082449}
.illus .load-t{fill:#fff}.illus .load-r{fill:#7cc4f5}.illus .load-l{fill:#4fa3f0}

.illus .jib-top{fill:#fff}.illus .jib-side{fill:#2f7be0}.illus .jib-lat{stroke:#fff;stroke-width:.7;stroke-opacity:.75}
.illus .cw-top{fill:#2f7be0}.illus .cw-side{fill:#1450a3}
.illus .trolley{fill:#0a2540}.illus .hookc{stroke:#0a2540;stroke-width:.9;stroke-opacity:.7}
.illus .hk{fill:none;stroke:#0a2540;stroke-width:1.6;stroke-linecap:round}


/* ---------- responsive ---------- */
@media (max-width:860px){
  body{padding:0;align-items:stretch}
  .card{grid-template-columns:1fr;border-radius:0;min-height:100vh}
  .card .shape{display:none}
  .hero{background:var(--blue-600);min-height:0;padding:20px 16px 22px;justify-content:flex-start;overflow:hidden}
  .welcome{writing-mode:horizontal-tb;font-size:40px;top:16px;inset-inline-start:auto;left:16px}
  .illus{position:relative;top:auto;left:auto;display:block;width:min(330px,88%);margin:52px auto 0}
  .hero .tagline{display:none}
  .form-side{padding:28px 16px 20px}
  .form-side h1{margin-top:28px;font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

      <polygon class="face f-left" points="9.9,21.2 30.1,32.9 30.1,56.2 9.9,44.5"/>
      <polygon class="face f-right" points="33.9,32.9 54.1,21.2 54.1,44.5 33.9,56.2"/>
      <circle class="node" cx="32" cy="31.8" r="4.4"/>
    </svg>
      <span class="word">PROJECT <b>HUB</b></span>
    </div>

    <h1>כניסה למערכת</h1>
    <p class="sub">ברוכים הבאים — היכנסו עם חשבון Microsoft של המשרד</p>

    <form id="loginForm" novalidate>
      <div class="field" id="fEmail">
        <label for="email">כתובת מייל</label>
        <div class="ctl">
          <input id="email" name="email" type="email" autocomplete="username" placeholder="name@office.co.il" required>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
        </div>
        <div class="err" role="alert">נא להזין כתובת מייל תקינה</div>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember" name="remember">
          <span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5"/></svg></span>
          זכור אותי במחשב זה
        </label>
      </div>

      <button class="btn" type="submit" id="submit"><span class="lbl"><svg class="ms" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>כניסה עם Microsoft</span><span class="spin" aria-hidden="true"></span></button>
      <p class="mode-note" id="modeNote" hidden>שרת מקומי — הכניסה ללא Microsoft</p>
    </form>

    <div class="foot">
      <span>© <span id="yr"></span> Project Hub</span>
      <nav><a class="link" href="#">עזרה</a><a class="link" href="#">צור קשר</a></nav>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const intro = $('intro'), introLogo = $('introLogo'), brand = $('brandLogo'), body = document.body;
  const KEY = 'projecthub.remember';
  $('yr').textContent = new Date().getFullYear();

  /* ---- remember me (LocalStorage) ---- */
  const store = {
    get(){ try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } },
    set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} },
    clear(){ try { localStorage.removeItem(KEY); } catch {} }
  };
  const saved = store.get();
  if (saved && saved.email) { $('email').value = saved.email; $('remember').checked = true; }

  /* ---- intro sequence ---- */
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let finished = false, timers = [];
  function reveal(){
    brand.classList.remove('pending');
    intro.classList.add('gone');
    body.classList.add('ready');
    (saved && saved.email ? $('submit') : $('email')).focus({preventScroll:true});
  }
  function fly(){
    if (finished) return; finished = true; timers.forEach(clearTimeout);
    body.classList.add('shown');
    requestAnimationFrame(() => {
      const a = introLogo.getBoundingClientRect(), b = brand.getBoundingClientRect();
      const s = b.width / a.width;
      intro.classList.add('fly');
      introLogo.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${s})`;
      setTimeout(reveal, 850);
    });
  }
  if (reduced) { body.classList.add('shown'); finished = true; reveal(); }
  else {
    timers.push(setTimeout(fly, 2700));
    $('skip').addEventListener('click', fly);
    intro.addEventListener('click', fly);
    addEventListener('keydown', e => { if (!finished && (e.key === 'Escape' || e.key === 'Enter')) fly(); });
  }


  /* ---- tower crane: slews, moves the trolley and hoists equipment at random ---- */
  (function crane(){
    const g = document.getElementById('craneDyn'); if (!g) return;
    const S=15, OX=250, OY=330, C=Math.cos(Math.PI/6), H=.5;
    const P=(x,y,z)=>[OX+(x-y)*C*S, OY+(x+y)*H*S - z*S];
    const pt=a=>a.map(p=>P(...p).map(v=>v.toFixed(1)).join(',')).join(' ');
    const MX=12.55, MY=1.95, TOP=17.5, APEX=TOP+2.2, JIB=11.5, CJ=3.4;
    const st={ang:180, trol:.72, drop:5.2, load:true};
    const loads=['beam','pallet','panel']; let loadKind='beam';
    function prism(ax,ay,bx,by,w,z0,z1,top,side,lat){
      const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1, nx=-dy/len*w/2, ny=dx/len*w/2;
      const sgn=(nx+ny)>0?1:-1;                   // side facing the viewer
      const sx=nx*sgn, sy=ny*sgn;
      let o=`<polygon class="${side}" points="${pt([[ax+sx,ay+sy,z0],[bx+sx,by+sy,z0],[bx+sx,by+sy,z1],[ax+sx,ay+sy,z1]])}"/>`;
      if(lat){ const n=Math.max(2,Math.round(len/1.1));
        for(let i=0;i<n;i++){const t0=i/n,t1=(i+1)/n,za=i%2?z1:z0,zb=i%2?z0:z1;
          const [x1,y1]=P(ax+dx*t0+sx,ay+dy*t0+sy,za),[x2,y2]=P(ax+dx*t1+sx,ay+dy*t1+sy,zb);
          o+=`<line class="jib-lat" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;} }
      o+=`<polygon class="${top}" points="${pt([[ax+nx,ay+ny,z1],[bx+nx,by+ny,z1],[bx-nx,by-ny,z1],[ax-nx,ay-ny,z1]])}"/>`;
      return o;
    }
    function isoBox(cx,cy,z,wx,wy,h,t,r,l){
      const x0=cx-wx/2,x1=cx+wx/2,y0=cy-wy/2,y1=cy+wy/2,z1=z+h;
      return `<polygon class="${r}" points="${pt([[x1,y0,z],[x1,y1,z],[x1,y1,z1],[x1,y0,z1]])}"/>`+
             `<polygon class="${l}" points="${pt([[x0,y1,z],[x1,y1,z],[x1,y1,z1],[x0,y1,z1]])}"/>`+
             `<polygon class="${t}" points="${pt([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]])}"/>`;
    }
    const line=(a,b,c)=>{const [x1,y1]=P(...a),[x2,y2]=P(...b);return `<line class="${c}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;};
    function draw(){
      const a=st.ang*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a);
      const tip=[MX+ux*JIB, MY+uy*JIB], back=[MX-ux*CJ, MY-uy*CJ];
      const tx=MX+ux*JIB*st.trol, ty=MY+uy*JIB*st.trol, hz=TOP-.2-st.drop;
      let o='';
      const hookPart = line([tx,ty,TOP-.2],[tx,ty,hz+.35],'hookc') +
        `<path class="hk" d="M${P(tx,ty,hz+.35).map(v=>v.toFixed(1)).join(',')} v4 a2 2 0 1 1 -3 -1"/>` +
        (st.load ? (loadKind==='beam' ? isoBox(tx,ty,hz-.55,2.6,.5,.4,'load-t','load-r','load-l')
                  : loadKind==='pallet' ? isoBox(tx,ty,hz-1.1,1.3,1.3,.95,'t','r','l')
                  : isoBox(tx,ty,hz-.9,.4,1.9,.75,'load-t','load-r','load-l')) : '');
      const jib = prism(MX,MY,tip[0],tip[1],.45,TOP-.2,TOP+.35,'jib-top','jib-side',true)
                + prism(MX,MY,back[0],back[1],.5,TOP-.1,TOP+.3,'jib-top','jib-side',false)
                + isoBox(back[0]+ux*.7,back[1]+uy*.7,TOP-1.1,.9,.9,.9,'cw-top','cw-side','cw-side')
                + line([MX,MY,APEX],[tip[0],tip[1],TOP+.35],'cable') + line([MX,MY,APEX],[back[0],back[1],TOP+.3],'cable')
                + isoBox(tx,ty,TOP-.45,.55,.55,.3,'trolley','trolley','trolley');
      // hook behind the jib when the jib points toward the viewer
      g.innerHTML = (ux+uy>0) ? jib+hookPart : hookPart+jib;
    }
    const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, rnd=(a,b)=>a+Math.random()*(b-a), wait=ms=>new Promise(r=>setTimeout(r,ms));
    function tween(key,to,speed){ return new Promise(res=>{ const from=st[key], dur=Math.max(300,Math.abs(to-from)/speed*1000), t0=performance.now();
      (function f(now){ const t=Math.min(1,(now-t0)/dur); st[key]=from+(to-from)*ease(t); draw(); t<1?requestAnimationFrame(f):res(); })(t0); }); }
    draw();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    (async function loop(){
      await wait(3600);
      for(;;){
        await tween('ang', rnd(115,215), 14);          // slew
        await tween('trol', rnd(.35,.95), .35);        // move trolley along the jib
        await tween('drop', rnd(4.6,6.6), 1.3);        // lower
        await wait(500);
        st.load=!st.load; if(st.load) loadKind=loads[Math.floor(Math.random()*loads.length)]; draw();   // pick up / set down
        await wait(400);
        await tween('drop', rnd(1.2,2.6), 1.1);        // raise
        await wait(rnd(300,1200));
      }
    })();
  })();

  /* ---- where to go, and how ----
     On Azure the server sends anyone without a session here (?next=<page>); the button hands
     the email to Microsoft sign-in (Easy Auth) as login_hint. The local server has no Microsoft
     sign-in: the button clears the app's signed-out flag and opens the app. */
  const nextRaw = new URLSearchParams(location.search).get('next') || '';
  const next = /^\/(?!\/)/.test(nextRaw) && !/^\/login/.test(nextRaw) ? nextRaw : '/project_hub_01';
  let mode = 'local';
  fetch('/api/me', { cache: 'no-store' }).then(r => {
    if (r.status === 401) { mode = 'cloud'; return null; }
    return r.ok ? r.json() : null;
  }).then(me => {
    if (!me) return;
    mode = me.mode || 'local';
    if (mode === 'cloud') location.replace(next);          // already signed in
    else $('modeNote').hidden = false;
  }).catch(() => { $('modeNote').hidden = false; });

  /* ---- submit ---- */
  const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  $('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const email = $('email').value.trim(), remember = $('remember').checked;
    $('fEmail').classList.toggle('invalid', !validEmail(email));
    if (!validEmail(email)) return $('email').focus();

    if (remember) store.set({ email, at: Date.now() }); else store.clear();

    const btn = $('submit');
    btn.classList.add('loading'); btn.disabled = true;
    if (mode === 'cloud') {
      location.href = '/.auth/login/aad?post_login_redirect_uri=' + encodeURIComponent(next) + '&login_hint=' + encodeURIComponent(email);
      return;
    }
    try { localStorage.removeItem('pm_signed_out'); } catch {}
    setTimeout(() => location.replace(next), 400);
  });
  $('email').addEventListener('input', () => $('fEmail').classList.remove('invalid'));
})();
</script>
</body>
</html>
